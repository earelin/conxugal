conxugal:
  contratos-menores:
    import:
      schedule: "0 0 5 * * *"
  metrics:
    stream:
      sample-interval: 5s
      heartbeat-interval: 15s
  organos:
    import:
      schedule: "0 0 3 * * *"

micronaut:
  application:
    name: conxugal
  executors:
    # No explicit `blocking` entry: declaring one at all — even just `virtual: true`
    # — disables Micronaut's default unbounded virtual thread-per-task executor and
    # replaces it with a capped platform-backed pool, undermining ADR-0011. Every
    # HTTP request shares this executor via thread-selection: BLOCKING below, so it
    # stays on Micronaut's default. The scheduled import gets its own executor
    # instead, so its pool sizing never constrains request-serving capacity.
    organos-import:
      type: scheduled
      core-pool-size: 1
      virtual: true
    # One thread, because the guard admits one import at a time anyway: a second thread could
    # only ever hold a run the guard had already refused. A contratos menores import occupies
    # its thread for days, which is why it cannot be the one serving requests.
    contratos-menores-import:
      type: fixed
      number-of-threads: 1
      virtual: true
  http:
    services:
      contratosdegalicia:
        url: https://www.contratosdegalicia.gal
        connect-timeout: 5s
        read-timeout: 10s
  router:
    static-resources:
      static-pages:
        paths: classpath:static-pages
        mapping: /assets/static-pages/**
      ui:
        paths: classpath:public
        mapping: /**
  security:
    enabled: true
    authentication: session
    basic-auth:
      enabled: false
    redirect:
      enabled: true
      login-success: /
      login-failure: /login?error=true
      logout: /login
      forbidden:
        enabled: true
        url: /forbidden
      unauthorized:
        enabled: true
        url: /login
    intercept-url-map:
      - pattern: /login
        access: [isAnonymous()]
      - pattern: /assets/static-pages/**
        access: [isAnonymous()]
      - pattern: /health
        access: [isAnonymous()]
      - pattern: /api/admin/**
        access: [ADMIN]
      - pattern: /api/**
        access: [isAuthenticated()]
      - pattern: /**
        access: [isAuthenticated()]
    csrf:
      enabled: true
      signature-key: ${CSRF_SIGNATURE_KEY:conxugal-dev-only-csrf-signature-key}
      filter:
        # The token guards the server-rendered form flow. It buys /api/** nothing: those
        # operations take a JSON body, which no cross-site form can produce and which is not
        # a CORS-simple content type, so a cross-origin fetch is preflighted and this server
        # answers no CORS. Meanwhile the filter refuses any request carrying no content type
        # at all — it only steps aside for a content type that is set and unlisted — and that
        # is every body-less DELETE the contract declares.
        #
        # What this does give up is the body-less POST: the import trigger needs no body, so a
        # cross-site fetch could reach it as a simple, unpreflighted request. The SameSite
        # attribute on the session cookie below is what withholds the credentials for it.
        regex-pattern: "^(?!/api/).*$"
  server:
    port: 8080
    thread-selection: BLOCKING
  session:
    http:
      cookie: true
      header: false
      # The id is a UUID and Base64 is no secret, so the encoding buys nothing — while
      # decoding it is unguarded: a cookie value outside the Base64 alphabet raises, and the
      # caller is answered 400 Bad Request instead of the 401 the contract declares for a
      # session that identifies nobody.
      base64-encode: false
      # Withholds the session from any cross-site request that is not a top-level navigation
      # by a safe method, which is what stands between a body-less state-changing POST — the
      # import trigger — and a cross-site fetch, now that the CSRF filter above no longer
      # covers /api/**. Lax rather than Strict so following a link into the application still
      # arrives authenticated; Strict would land the caller on the login page having lost
      # where they were going. Stated rather than left to the browser: the default is Lax in
      # some and absent in others, and only an explicit value closes the window Chrome leaves
      # open for a cookie that names none.
      cookie-same-site: Lax
    max-inactive-interval: 30m

datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/conxugal`}
    username: ${JDBC_USERNAME:conxugal}
    password: ${JDBC_PASSWORD:conxugal}
    driverClassName: org.postgresql.Driver
    dialect: POSTGRES

# Migrations live in infrastructure's src/main/resources/db/migration (infrastructure
# owns persistence), not next to this file.
flyway:
  datasources:
    default:
      enabled: true
