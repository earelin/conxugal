micronaut:
  application:
    name: conxugal-server
  server:
    port: 8080
  security:
    enabled: true
    authentication: session
    basic-auth:
      enabled: false
    redirect:
      enabled: true
      login-success: /
      login-failure: /login?error=true
      logout: /login
      forbidden:
        enabled: true
        url: /forbidden
      unauthorized:
        enabled: true
        url: /login
    intercept-url-map:
      - pattern: /login
        access: [isAnonymous()]
      - pattern: /api/admin/**
        access: [ADMIN]
      - pattern: /api/**
        access: [isAuthenticated()]
    csrf:
      enabled: true
      signature-key: ${CSRF_SIGNATURE_KEY:conxugal-dev-only-csrf-signature-key}
  session:
    http:
      cookie: true
      header: false
    max-inactive-interval: 30m

datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/conxugal`}
    username: ${JDBC_USERNAME:conxugal}
    password: ${JDBC_PASSWORD:conxugal}
    driverClassName: org.postgresql.Driver
    dialect: POSTGRES

# Migrations live in infrastructure's src/main/resources/db/migration (infrastructure
# owns persistence), not next to this file.
flyway:
  datasources:
    default:
      enabled: true
