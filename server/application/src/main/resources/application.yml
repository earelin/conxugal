conxugal:
  contratosdegalicia:
    base-url: https://www.contratosdegalicia.gal
    read-timeout: 10s
  metrics:
    stream:
      sample-interval: 5s
      heartbeat-interval: 15s
  organos:
    import:
      schedule: "0 0 3 * * *"

micronaut:
  application:
    name: conxugal
  executors:
    # No explicit `blocking` entry: declaring one at all — even just `virtual: true`
    # — disables Micronaut's default unbounded virtual thread-per-task executor and
    # replaces it with a capped platform-backed pool, undermining ADR-0011. Every
    # HTTP request shares this executor via thread-selection: BLOCKING below, so it
    # stays on Micronaut's default. The scheduled import gets its own executor
    # instead, so its pool sizing never constrains request-serving capacity.
    organos-import:
      type: scheduled
      core-pool-size: 1
      virtual: true
  router:
    static-resources:
      static-pages:
        paths: classpath:static-pages
        mapping: /assets/static-pages/**
      ui:
        paths: classpath:public
        mapping: /**
  security:
    enabled: true
    authentication: session
    basic-auth:
      enabled: false
    redirect:
      enabled: true
      login-success: /
      login-failure: /login?error=true
      logout: /login
      forbidden:
        enabled: true
        url: /forbidden
      unauthorized:
        enabled: true
        url: /login
    intercept-url-map:
      - pattern: /login
        access: [isAnonymous()]
      - pattern: /assets/static-pages/**
        access: [isAnonymous()]
      - pattern: /health
        access: [isAnonymous()]
      - pattern: /api/admin/**
        access: [ADMIN]
      - pattern: /api/**
        access: [isAuthenticated()]
      - pattern: /**
        access: [isAuthenticated()]
    csrf:
      enabled: true
      signature-key: ${CSRF_SIGNATURE_KEY:conxugal-dev-only-csrf-signature-key}
  server:
    port: 8080
    thread-selection: BLOCKING
  session:
    http:
      cookie: true
      header: false
    max-inactive-interval: 30m

datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/conxugal`}
    username: ${JDBC_USERNAME:conxugal}
    password: ${JDBC_PASSWORD:conxugal}
    driverClassName: org.postgresql.Driver
    dialect: POSTGRES

# Migrations live in infrastructure's src/main/resources/db/migration (infrastructure
# owns persistence), not next to this file.
flyway:
  datasources:
    default:
      enabled: true
