<!doctype html>
<html lang="gl" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Algo foi mal · conxugal</title>
    <link rel="stylesheet" href="/assets/static-pages/static-pages.css" />
  </head>
  <body>
    <main class="page">
      <div th:replace="~{fragments/brand :: brand}"></div>

      <div class="status-card">
        <div class="status-glyph">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <path
              d="M14 3 L26 24 H2 Z"
              stroke="#4c6ef5"
              stroke-width="2.4"
              fill="none"
              stroke-linejoin="round"
              stroke-linecap="round"
            ></path>
            <line x1="14" y1="10.5" x2="14" y2="17" stroke="#4c6ef5" stroke-width="2.4" stroke-linecap="round"></line>
            <circle cx="14" cy="20.3" r="1.4" fill="#4c6ef5"></circle>
          </svg>
        </div>

        <p class="status-code">ERRO 500</p>
        <h1 class="status-title">Algo foi mal</h1>
        <p class="status-description">Produciuse un erro inesperado e non puidemos completar a petición.</p>
        <p class="status-description">Téntao de novo nuns intres.</p>

        <div class="status-actions">
          <a class="btn-primary" th:href="@{${retryHref}}" href="/">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M13 8 a5 5 0 1 1 -1.4 -3.5"
                stroke="#ffffff"
                stroke-width="1.6"
                fill="none"
                stroke-linecap="round"
              ></path>
              <path
                d="M11.5 2 v3.5 h-3.5"
                stroke="#ffffff"
                stroke-width="1.6"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
            Reintentar
          </a>
          <a class="btn-link" href="/">Volver ao inicio</a>
        </div>
      </div>
    </main>
  </body>
</html>
