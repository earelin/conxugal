// infrastructure — the driven side (ADR-0002): adapters that reach external
// services (PostgreSQL persistence, external scrapers/ingestors, exporters),
// implementing ports defined in domain. Depends on domain and nothing else; it
// does NOT depend on application.
plugins {
    alias(libs.plugins.micronaut.library)
}

dependencies {
    implementation(project(":domain"))

    // PostgreSQL persistence (ADR-0001). Datasource connectivity and migration
    // tooling are wired here; the repositories/schema themselves are introduced
    // by the first persistence feature.
    implementation(libs.micronaut.jdbc.hikari)
    runtimeOnly(libs.postgresql)

    // Flyway runs migrations from this module's db/migration resources on
    // startup (configured in application.yml, which lives in `application`).
    // flyway-core/flyway-database-postgresql versions are forced past the
    // BOM's — see libs.versions.toml.
    runtimeOnly(libs.micronaut.flyway)
    runtimeOnly(libs.flyway.core)
    runtimeOnly(libs.flyway.database.postgresql)
}

micronaut {
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("gal.conxugal.infrastructure.*")
    }
}
