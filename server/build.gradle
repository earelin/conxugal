// Root build for the conxugal server (ADR-0001: Micronaut, Java 25, PostgreSQL).
// Plugins are declared here (apply false) so the modules can apply them by alias
// without repeating the version.
plugins {
    alias(libs.plugins.micronaut.application) apply false
    alias(libs.plugins.micronaut.library) apply false
}

subprojects {
    group = "gal.conxugal"
    version = "0.1.0-SNAPSHOT"

    repositories {
        mavenCentral()
    }

    // Every module is a Java 25 project. The Micronaut plugins apply the `java`
    // plugin; we pin the toolchain once here for all of them.
    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }
    }
}
