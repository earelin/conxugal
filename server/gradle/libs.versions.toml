# Version catalog — single source of truth for dependencies.
#
# The Micronaut platform (BOM) governs the versions of every io.micronaut* and
# driver dependency (see `micronautVersion` in gradle.properties), so the library
# entries below are declared WITHOUT versions; the BOM resolves them at build time.
[versions]
# acceptance module (ADR-0007): assertj, junit, restAssured, and wiremock are
# versioned explicitly since the module is a plain `java` module, outside the
# Micronaut BOM's reach.
assertj = "3.27.7"
assertjDb = "3.0.0"
bouncyCastle = "1.80"
# Flyway 12 moved database-specific support (e.g. PostgreSQL) out of flyway-core
# into separate plugin artifacts not covered by the Micronaut BOM's constraint;
# both must share one version, so it's pinned here to the latest release.
flywayCore = "12.10.0"
junit = "6.1.1"
micronautPlugin = "5.0.2"
restAssured = "6.0.0"
testcontainers = "1.21.3"
wiremock = "3.13.2"

[libraries]
# Versioned explicitly (unlike the io.micronaut*/driver entries, which the BOM
# resolves) so it also resolves in the `acceptance` module, which sits outside the
# Micronaut BOM's reach.
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
assertj-db = { module = "org.assertj:assertj-db", version.ref = "assertjDb" }
bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncyCastle" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flywayCore" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flywayCore" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
logback-classic = { module = "ch.qos.logback:logback-classic" }
micronaut-data-jdbc = { module = "io.micronaut.data:micronaut-data-jdbc" }
micronaut-data-model = { module = "io.micronaut.data:micronaut-data-model" }
micronaut-data-processor = { module = "io.micronaut.data:micronaut-data-processor" }
micronaut-flyway = { module = "io.micronaut.flyway:micronaut-flyway" }
micronaut-http-client = { module = "io.micronaut:micronaut-http-client" }
micronaut-http-server-netty = { module = "io.micronaut:micronaut-http-server-netty" }
micronaut-jdbc-hikari = { module = "io.micronaut.sql:micronaut-jdbc-hikari" }
micronaut-serde-jackson = { module = "io.micronaut.serde:micronaut-serde-jackson" }
micronaut-test-junit5 = { module = "io.micronaut.test:micronaut-test-junit5" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter" }
postgresql = { module = "org.postgresql:postgresql" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "restAssured" }
snakeyaml = { module = "org.yaml:snakeyaml" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }

[plugins]
micronaut-application = { id = "io.micronaut.application", version.ref = "micronautPlugin" }
micronaut-library = { id = "io.micronaut.library", version.ref = "micronautPlugin" }
