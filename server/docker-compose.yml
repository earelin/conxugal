
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: conxugal
      POSTGRES_USER: conxugal
      POSTGRES_PASSWORD: conxugal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conxugal -d conxugal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
