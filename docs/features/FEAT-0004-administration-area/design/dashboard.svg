<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- ===== app background & AppShell frame ===== -->
  <rect width="1280" height="840" fill="#f8f9fa"/>
  <rect x="0" y="0" width="1280" height="60" fill="#ffffff"/>
  <rect x="0" y="60" width="260" height="780" fill="#ffffff"/>
  <line x1="0" y1="60" x2="1280" y2="60" stroke="#dee2e6" stroke-width="1"/>
  <line x1="260" y1="60" x2="260" y2="840" stroke="#dee2e6" stroke-width="1"/>

  <!-- ===== header ===== -->
  <text x="24" y="31" font-size="20" font-weight="700" fill="#212529">conxugal</text>
  <text x="24" y="47" font-size="11" fill="#868e96">Contratos públicos da Xunta de Galicia</text>
  <!-- theme toggle -->
  <g stroke="#868e96" stroke-width="1.5" fill="none">
    <circle cx="1116" cy="30" r="4.5"/>
    <g stroke-linecap="round">
      <line x1="1116" y1="21.5" x2="1116" y2="23.5"/><line x1="1116" y1="36.5" x2="1116" y2="38.5"/>
      <line x1="1107.5" y1="30" x2="1109.5" y2="30"/><line x1="1122.5" y1="30" x2="1124.5" y2="30"/>
      <line x1="1110" y1="24" x2="1111.4" y2="25.4"/><line x1="1120.6" y1="34.6" x2="1122" y2="36"/>
      <line x1="1122" y1="24" x2="1120.6" y2="25.4"/><line x1="1111.4" y1="34.6" x2="1110" y2="36"/>
    </g>
  </g>
  <line x1="1148" y1="16" x2="1148" y2="44" stroke="#e9ecef" stroke-width="1"/>
  <text x="1210" y="26" text-anchor="end" font-size="13" font-weight="500" fill="#495057">ana.pereira@conxugal.gal</text>
  <text x="1210" y="42" text-anchor="end" font-size="11" fill="#868e96">Administradora</text>
  <circle cx="1236" cy="30" r="18" fill="#4c6ef5"/>
  <text x="1236" y="30" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#ffffff">AP</text>

  <!-- ===== navbar ===== -->
  <!-- Inicio -->
  <g stroke="#868e96" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 111 L37 102 L47 111 M29.5 108.5 V119 H44.5 V108.5" transform="translate(-3,-1)"/>
  </g>
  <text x="52" y="106" font-size="14" fill="#495057">Inicio</text>
  <!-- Acerca de -->
  <g stroke="#868e96" stroke-width="1.6" fill="none">
    <circle cx="34" cy="149" r="8"/>
    <line x1="34" y1="147" x2="34" y2="153" stroke-linecap="round"/>
    <circle cx="34" cy="143.5" r="0.6" fill="#868e96" stroke="none"/>
  </g>
  <text x="52" y="154" font-size="14" fill="#495057">Acerca de</text>

  <!-- section label -->
  <text x="24" y="192" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">ADMINISTRACIÓN</text>

  <!-- Panel (active) -->
  <rect x="12" y="206" width="236" height="42" rx="8" fill="#edf2ff"/>
  <g stroke="#4263eb" stroke-width="1.6" fill="none">
    <rect x="24" y="217" width="8" height="9" rx="1.5"/>
    <rect x="36" y="217" width="8" height="5" rx="1.5"/>
    <rect x="24" y="230" width="8" height="5" rx="1.5"/>
    <rect x="36" y="226" width="8" height="9" rx="1.5"/>
  </g>
  <text x="52" y="232" font-size="14" font-weight="600" fill="#3b5bdb">Panel</text>
  <!-- Usuarios -->
  <g stroke="#868e96" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="31" cy="271" r="3"/>
    <path d="M25 283 c0 -3.5 3 -5 6 -5 s6 1.5 6 5"/>
    <circle cx="41.5" cy="273" r="2.4"/>
    <path d="M41 279 c2.5 0 4.5 1.3 4.5 4" />
  </g>
  <text x="52" y="280" font-size="14" fill="#495057">Usuarios</text>

  <!-- ===== main: dashboard ===== -->
  <text x="284" y="112" font-size="26" font-weight="700" fill="#212529">Panel do sistema</text>
  <text x="284" y="138" font-size="14" fill="#868e96">Estado operativo do sistema no momento da consulta.</text>

  <!-- banner: overall service state -->
  <rect x="284" y="164" width="972" height="92" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="284" y="162" width="972" height="92" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <circle cx="322" cy="208" r="22" fill="#ebfbee"/>
  <path d="M313 208 l6 6 l12 -13" stroke="#2f9e44" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="362" y="202" font-size="18" font-weight="600" fill="#212529">Sistema operativo</text>
  <text x="362" y="224" font-size="13" fill="#868e96">Todos os compoñentes responden con normalidade.</text>
  <text x="1188" y="204" text-anchor="end" font-size="12" fill="#868e96">Comprobado o 09/07/2026 ás 12:45</text>
  <circle cx="1216" cy="208" r="17" fill="#ffffff" stroke="#dee2e6"/>
  <g stroke="#4263eb" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1210 205 a6 6 0 1 0 1.5 -4"/>
    <path d="M1209.5 199 v3 h3"/>
  </g>

  <!-- stat card A: Servizo -->
  <rect x="284" y="276" width="476" height="140" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="284" y="274" width="476" height="140" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="308" y="306" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">SERVIZO</text>
  <circle cx="316" cy="342" r="5" fill="#40c057"/>
  <text x="330" y="350" font-size="24" font-weight="600" fill="#212529">Operativo</text>
  <rect x="648" y="296" width="88" height="24" rx="12" fill="#ebfbee"/>
  <text x="692" y="308" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="0.4" fill="#2b8a3e">EN LIÑA</text>
  <line x1="308" y1="374" x2="736" y2="374" stroke="#f1f3f5"/>
  <text x="308" y="396" font-size="12" fill="#868e96">Sen incidencias rexistradas nas últimas 24 h.</text>

  <!-- stat card B: Base de datos -->
  <rect x="780" y="276" width="476" height="140" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="780" y="274" width="476" height="140" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="804" y="306" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">BASE DE DATOS</text>
  <circle cx="812" cy="342" r="5" fill="#40c057"/>
  <text x="826" y="350" font-size="24" font-weight="600" fill="#212529">Accesible</text>
  <rect x="1128" y="296" width="104" height="24" rx="12" fill="#ebfbee"/>
  <text x="1180" y="308" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="0.4" fill="#2b8a3e">CONECTADA</text>
  <line x1="804" y1="374" x2="1232" y2="374" stroke="#f1f3f5"/>
  <text x="804" y="396" font-size="12" fill="#868e96">Conexión verificada na última sonda (hai 2 s).</text>

  <!-- runtime info card -->
  <rect x="284" y="436" width="972" height="224" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="284" y="434" width="972" height="224" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="308" y="470" font-size="16" font-weight="600" fill="#212529">Información do sistema</text>
  <line x1="308" y1="486" x2="1232" y2="486" stroke="#f1f3f5"/>

  <!-- row 1 -->
  <text x="308" y="522" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">VERSIÓN DA APLICACIÓN</text>
  <text x="308" y="546" font-size="15" fill="#212529">0.1.0</text>
  <text x="620" y="522" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">CONTORNO</text>
  <text x="620" y="546" font-size="15" fill="#212529">produción</text>
  <text x="932" y="522" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">RUNTIME</text>
  <text x="932" y="546" font-size="15" fill="#212529">Java 21 (Temurin)</text>
  <!-- row 2 -->
  <text x="308" y="586" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">TEMPO DE ACTIVIDADE</text>
  <text x="308" y="610" font-size="15" fill="#212529">3 d 04 h 12 m</text>
  <text x="620" y="586" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">USO DE MEMORIA</text>
  <text x="620" y="610" font-size="15" fill="#212529">512 / 1024 MB</text>
  <text x="932" y="586" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">SISTEMA OPERATIVO</text>
  <text x="932" y="610" font-size="15" fill="#212529">Linux (amd64)</text>

  <!-- privacy note -->
  <line x1="308" y1="628" x2="1232" y2="628" stroke="#f1f3f5"/>
  <g stroke="#adb5bd" stroke-width="1.4" fill="none">
    <rect x="308" y="641" width="11" height="8" rx="1.5"/>
    <path d="M310 641 v-2 a3.5 3.5 0 0 1 7 0 v2"/>
  </g>
  <text x="328" y="648" font-size="12" fill="#868e96">A información de estado nunca inclúe credenciais nin cadeas de conexión.</text>
</svg>
