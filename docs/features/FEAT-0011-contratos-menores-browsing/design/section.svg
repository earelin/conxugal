  <!-- ===== annotations ===== -->
  <rect x="284" y="880" width="308" height="120" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <circle cx="304" cy="902" r="10" fill="#4c6ef5"/>
  <text x="304" y="902" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="322" y="906" font-size="12" font-weight="600" fill="#495057">O nome e a lapela non son desta slice</text>
  <text x="302" y="930" font-size="11.5" fill="#868e96">Son de FEAT-0013. Esta sección móntase no</text>
  <text x="302" y="947" font-size="11.5" fill="#868e96">seu outlet e non le o órgano por ningunha</text>
  <text x="302" y="964" font-size="11.5" fill="#868e96">banda: o resumo — anos, «parcial» e «xa non</text>
  <text x="302" y="981" font-size="11.5" fill="#868e96">se actualiza» — chégalle como contexto.</text>

  <rect x="616" y="880" width="308" height="120" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <circle cx="636" cy="902" r="10" fill="#4c6ef5"/>
  <text x="636" y="902" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="654" y="906" font-size="12" font-weight="600" fill="#495057">Un ano, unha orde de catro posibles</text>
  <text x="634" y="930" font-size="11.5" fill="#868e96">O selector ofrece só anos nos que hai</text>
  <text x="634" y="947" font-size="11.5" fill="#868e96">contratos visibles, e non ofrece nada máis:</text>
  <text x="634" y="964" font-size="11.5" fill="#868e96">non hai lista de todos os anos. A orde é un</text>
  <text x="634" y="981" font-size="11.5" fill="#868e96">conxunto pechado, dúas claves por dous sentidos.</text>

  <rect x="948" y="880" width="308" height="120" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <circle cx="968" cy="902" r="10" fill="#4c6ef5"/>
  <text x="968" y="902" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="986" y="906" font-size="12" font-weight="600" fill="#495057">O control de paxinación é de shared/ui</text>
  <text x="966" y="930" font-size="11.5" fill="#868e96">Primeira, anterior, seguinte, última e salto a</text>
  <text x="966" y="947" font-size="11.5" fill="#868e96">páxina, co número de rexistros e o total de</text>
  <text x="966" y="964" font-size="11.5" fill="#868e96">páxinas ditos. Constrúese aquí unha vez</text>
  <text x="966" y="981" font-size="11.5" fill="#868e96">porque outras dúas especificacións o toman.</text>
</svg>
