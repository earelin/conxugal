<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1280" height="740" fill="#f8f9fa"/>

  <text x="80" y="60" font-size="22" font-weight="700" fill="#212529">O control de paxinación</text>
  <text x="80" y="84" font-size="13" fill="#868e96">Vive en shared/ui e non sabe nada de contratos: toma un total, unha páxina e un tamaño, e emite unha páxina. Outras dúas especificacións tómano tal cal.</text>

  <!-- ===== A: first page ===== -->
  <text x="80" y="126" font-size="12" font-weight="600" fill="#495057">Primeira páxina</text>
  <rect x="80" y="136" width="1120" height="70" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="104" y="171" dominant-baseline="central" font-size="12.5" fill="#868e96">1 832 rexistros</text>
  <rect x="596" y="154" width="96" height="34" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="652" y="171" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#adb5bd">Primeira</text>
  <g stroke="#ced4da" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M622 166 l-5 5 l5 5 M612 162 v18"/>
  </g>
  <rect x="700" y="154" width="96" height="34" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="756" y="171" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#adb5bd">Anterior</text>
  <path d="M724 165 l-5 6 l5 6" stroke="#ced4da" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="812" y="171" dominant-baseline="central" font-size="12.5" fill="#868e96">Páxina</text>
  <rect x="860" y="154" width="52" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="886" y="171" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#212529">1</text>
  <text x="920" y="171" dominant-baseline="central" font-size="12.5" fill="#868e96">de 37</text>
  <rect x="976" y="154" width="96" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="1018" y="171" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#495057">Seguinte</text>
  <path d="M1054 165 l5 6 l-5 6" stroke="#495057" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1080" y="154" width="96" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="1118" y="171" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#495057">Última</text>
  <g stroke="#495057" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1150 166 l5 5 l-5 5 M1160 162 v18"/>
  </g>

  <!-- ===== B: a middle page ===== -->
  <text x="80" y="234" font-size="12" font-weight="600" fill="#495057">Páxina intermedia</text>
  <rect x="80" y="244" width="1120" height="70" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="104" y="279" dominant-baseline="central" font-size="12.5" fill="#868e96">1 832 rexistros</text>
  <rect x="596" y="262" width="96" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="652" y="279" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#495057">Primeira</text>
  <g stroke="#495057" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M622 274 l-5 5 l5 5 M612 270 v18"/>
  </g>
  <rect x="700" y="262" width="96" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="756" y="279" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#495057">Anterior</text>
  <path d="M724 273 l-5 6 l5 6" stroke="#495057" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="812" y="279" dominant-baseline="central" font-size="12.5" fill="#868e96">Páxina</text>
  <rect x="860" y="262" width="52" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="886" y="279" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#212529">3</text>
  <text x="920" y="279" dominant-baseline="central" font-size="12.5" fill="#868e96">de 37</text>
  <rect x="976" y="262" width="96" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="1018" y="279" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#495057">Seguinte</text>
  <path d="M1054 273 l5 6 l-5 6" stroke="#495057" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1080" y="262" width="96" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="1118" y="279" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#495057">Última</text>
  <g stroke="#495057" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1150 274 l5 5 l-5 5 M1160 270 v18"/>
  </g>

  <!-- ===== C: last page ===== -->
  <text x="80" y="342" font-size="12" font-weight="600" fill="#495057">Última páxina</text>
  <rect x="80" y="352" width="1120" height="70" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="104" y="387" dominant-baseline="central" font-size="12.5" fill="#868e96">1 832 rexistros</text>
  <rect x="596" y="370" width="96" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="652" y="387" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#495057">Primeira</text>
  <g stroke="#495057" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M622 382 l-5 5 l5 5 M612 378 v18"/>
  </g>
  <rect x="700" y="370" width="96" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="756" y="387" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#495057">Anterior</text>
  <path d="M724 381 l-5 6 l5 6" stroke="#495057" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="812" y="387" dominant-baseline="central" font-size="12.5" fill="#868e96">Páxina</text>
  <rect x="860" y="370" width="52" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="886" y="387" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#212529">37</text>
  <text x="920" y="387" dominant-baseline="central" font-size="12.5" fill="#868e96">de 37</text>
  <rect x="976" y="370" width="96" height="34" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="1018" y="387" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#adb5bd">Seguinte</text>
  <path d="M1054 381 l5 6 l-5 6" stroke="#ced4da" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1080" y="370" width="96" height="34" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="1118" y="387" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#adb5bd">Última</text>
  <g stroke="#ced4da" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1150 382 l5 5 l-5 5 M1160 378 v18"/>
  </g>

  <!-- ===== D: a single page ===== -->
  <text x="80" y="450" font-size="12" font-weight="600" fill="#495057">Unha soa páxina</text>
  <rect x="80" y="460" width="1120" height="70" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="104" y="495" dominant-baseline="central" font-size="12.5" fill="#868e96">18 rexistros</text>
  <rect x="596" y="478" width="96" height="34" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="652" y="495" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#adb5bd">Primeira</text>
  <g stroke="#ced4da" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M622 490 l-5 5 l5 5 M612 486 v18"/>
  </g>
  <rect x="700" y="478" width="96" height="34" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="756" y="495" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#adb5bd">Anterior</text>
  <path d="M724 489 l-5 6 l5 6" stroke="#ced4da" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="812" y="495" dominant-baseline="central" font-size="12.5" fill="#868e96">Páxina</text>
  <rect x="860" y="478" width="52" height="34" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="886" y="495" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#adb5bd">1</text>
  <text x="920" y="495" dominant-baseline="central" font-size="12.5" fill="#868e96">de 1</text>
  <rect x="976" y="478" width="96" height="34" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="1018" y="495" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#adb5bd">Seguinte</text>
  <path d="M1054 489 l5 6 l-5 6" stroke="#ced4da" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1080" y="478" width="96" height="34" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="1118" y="495" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#adb5bd">Última</text>
  <g stroke="#ced4da" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1150 490 l5 5 l-5 5 M1160 486 v18"/>
  </g>

  <!-- ===== notes ===== -->
  <rect x="80" y="562" width="546" height="150" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <text x="100" y="588" font-size="12" font-weight="600" fill="#495057">Le o sobre directamente</text>
  <text x="100" y="610" font-size="11.5" fill="#868e96">page, size, totalItems e totalPages son os catro valores que</text>
  <text x="100" y="627" font-size="11.5" fill="#868e96">renderiza, na base na que veñen. Non hai conversión nin</text>
  <text x="100" y="644" font-size="11.5" fill="#868e96">aritmética entre o fío e o control, así que non hai onde as listas</text>
  <text x="100" y="661" font-size="11.5" fill="#868e96">doutras especificacións poidan divirxir desta — que é</text>
  <text x="100" y="678" font-size="11.5" fill="#868e96">exactamente a incoherencia que R17 existe para evitar.</text>
  <text x="100" y="700" font-size="11.5" fill="#adb5bd">O número da URL, o que a API toma e o que aquí se ve son un só.</text>

  <rect x="654" y="562" width="546" height="150" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <text x="674" y="588" font-size="12" font-weight="600" fill="#495057">Os dous extremos son controis propios</text>
  <text x="674" y="610" font-size="11.5" fill="#868e96">Primeira e última ofrécense por nome, non contando páxinas:</text>
  <text x="674" y="627" font-size="11.5" fill="#868e96">son as dúas que un lector pide, a máis nova e a máis vella.</text>
  <text x="674" y="649" font-size="11.5" fill="#868e96">Nos extremos desactívanse, non desaparecen. Nunha soa</text>
  <text x="674" y="666" font-size="11.5" fill="#868e96">páxina desactívanse as catro e o control segue dicindo cantos</text>
  <text x="674" y="683" font-size="11.5" fill="#868e96">rexistros hai, porque esa cifra é unha resposta en si mesma.</text>
  <text x="674" y="705" font-size="11.5" fill="#adb5bd">Unha páxina fóra de rango devolve unha páxina baleira co total verdadeiro.</text>
</svg>
