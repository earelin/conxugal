<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Confirmación ao marcar un órgano para importar os seus contratos menores</title>
  <defs>
    <filter id="modalShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="11"/>
    </filter>
  </defs>

  <!-- ===== backdrop: the Órganos section (context behind the dialog) ===== -->
  <rect width="1280" height="840" fill="#f8f9fa"/>
  <rect x="0" y="0" width="1280" height="60" fill="#ffffff"/>
  <rect x="0" y="60" width="260" height="780" fill="#ffffff"/>
  <line x1="0" y1="60" x2="1280" y2="60" stroke="#dee2e6" stroke-width="1"/>
  <line x1="260" y1="60" x2="260" y2="840" stroke="#dee2e6" stroke-width="1"/>
  <g transform="translate(24,12) scale(0.18)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="#4c6ef5"/>
    <path d="M 132 55 A 56 56 0 1 0 132 145" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    <path d="M 112 100 L 176 100" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round"/>
    <path d="M 156 80 L 178 100 L 156 120" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="72" y="31" font-size="20" font-weight="700" fill="#212529">conxugal</text>
  <text x="72" y="47" font-size="11" fill="#868e96">Contratos públicos da Xunta de Galicia</text>
  <circle cx="1236" cy="30" r="18" fill="#4c6ef5"/>
  <text x="1236" y="30" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#ffffff">AP</text>
  <text x="24" y="192" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">ADMINISTRACIÓN</text>
  <text x="52" y="232" font-size="14" fill="#495057">Panel</text>
  <text x="52" y="264" font-size="14" fill="#495057">Usuarios</text>
  <rect x="12" y="286" width="236" height="42" rx="8" fill="#edf2ff"/>
  <text x="52" y="312" font-size="14" font-weight="600" fill="#3b5bdb">Órganos</text>
  <text x="284" y="112" font-size="26" font-weight="700" fill="#212529">Órganos</text>
  <text x="284" y="138" font-size="14" fill="#868e96">Organiza o catálogo nunha taxonomía e clasifica os órganos de contratación.</text>
  <rect x="800" y="160" width="248" height="40" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="842" y="185" font-size="14" font-weight="600" fill="#495057">Importar contratos menores</text>
  <rect x="1056" y="160" width="200" height="40" rx="8" fill="#4c6ef5"/>
  <text x="1100" y="185" font-size="14" font-weight="600" fill="#ffffff">Importar catálogo</text>
  <rect x="284" y="316" width="400" height="502" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="308" y="348" font-size="15" font-weight="600" fill="#212529">Taxonomía</text>
  <rect x="296" y="426" width="372" height="34" rx="8" fill="#edf2ff"/>
  <text x="352" y="447" font-size="14" font-weight="600" fill="#3b5bdb">Consellería de Sanidade</text>
  <rect x="708" y="316" width="548" height="502" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="732" y="434" font-size="22" font-weight="700" fill="#212529">Consellería de Sanidade</text>
  <line x1="732" y1="450" x2="1232" y2="450" stroke="#f1f3f5"/>
  <rect x="708" y="466" width="548" height="48" fill="#f8f9fa"/>
  <text x="732" y="540" font-size="14" font-weight="500" fill="#212529">Servizo Galego de Saúde</text>

  <!-- ===== dim overlay ===== -->
  <rect width="1280" height="840" fill="#101113" opacity="0.55"/>

  <!-- ===== modal ===== -->
  <rect x="380" y="206" width="520" height="380" rx="10" fill="#000000" opacity="0.45" filter="url(#modalShadow)"/>
  <rect x="380" y="200" width="520" height="380" rx="10" fill="#ffffff"/>

  <!-- header -->
  <text x="404" y="236" font-size="18" font-weight="600" fill="#212529">Importar contratos menores</text>
  <g stroke="#868e96" stroke-width="1.6" stroke-linecap="round">
    <line x1="867" y1="225" x2="877" y2="235"/><line x1="877" y1="225" x2="867" y2="235"/>
  </g>
  <line x1="380" y1="254" x2="900" y2="254" stroke="#f1f3f5"/>

  <!-- body -->
  <text x="404" y="286" font-size="14" fill="#495057" xml:space="preserve">Vas marcar <tspan font-weight="600" fill="#212529">Servizo Galego de Saúde (SERGAS)</tspan> para</text>
  <text x="404" y="306" font-size="14" fill="#495057">importar os seus contratos menores.</text>

  <rect x="404" y="326" width="472" height="88" rx="8" fill="#fff4e6"/>
  <g stroke="#e8590c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M428 344 l7 12 h-14 z"/>
    <path d="M428 348 v3.4"/>
  </g>
  <circle cx="428" cy="354" r="0.9" fill="#e8590c"/>
  <text x="448" y="350" font-size="12" font-weight="600" fill="#d9480f">A primeira importación descarga todo o historial publicado</text>
  <text x="448" y="368" font-size="12" font-weight="600" fill="#d9480f">deste órgano e pode durar días.</text>
  <text x="448" y="390" font-size="12" fill="#e8590c">Mentres se executa, non se poderá lanzar ningunha outra</text>
  <text x="448" y="404" font-size="12" fill="#e8590c">importación, nin sequera a do catálogo.</text>

  <g stroke="#40c057" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M406 440 l4 4 l7 -8"/>
  </g>
  <text x="428" y="444" font-size="12" fill="#495057">Empeza polas publicacións máis recentes, así que o máis</text>
  <text x="428" y="460" font-size="12" fill="#495057">consultado aparece desde as primeiras horas.</text>
  <g stroke="#40c057" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M406 486 l4 4 l7 -8"/>
  </g>
  <text x="428" y="490" font-size="12" fill="#495057">Podes deixar de importar cando queiras: o xa gardado</text>
  <text x="428" y="506" font-size="12" fill="#495057">consérvase e a importación retómase onde quedou.</text>

  <!-- footer -->
  <line x1="380" y1="522" x2="900" y2="522" stroke="#f1f3f5"/>
  <rect x="606" y="536" width="96" height="40" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="654" y="557" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#495057">Cancelar</text>
  <rect x="710" y="536" width="166" height="40" rx="8" fill="#4c6ef5"/>
  <text x="793" y="557" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#ffffff">Marcar e importar</text>
</svg>
