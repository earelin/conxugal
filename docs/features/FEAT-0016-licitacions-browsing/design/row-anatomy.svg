<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1280" height="800" fill="#f8f9fa"/>

  <text x="80" y="60" font-size="22" font-weight="700" fill="#212529">Anatomía dunha fila</text>
  <text x="80" y="84" font-size="13" fill="#868e96">Seis valores e unha ligazón. A licitación ten páxina de detalle, pero é doutra funcionalidade, así que a fila de hoxe non leva a ningures: o que non caiba nela agarda.</text>

  <!-- ===== the row, at scale ===== -->
  <rect x="80" y="114" width="1120" height="180" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="80" y="112" width="1120" height="180" rx="8" fill="#ffffff" stroke="#dee2e6"/>

  <path d="M80 120 a8 8 0 0 1 8 -8 h1104 a8 8 0 0 1 8 8 v44 h-1120 z" fill="#f8f9fa"/>
  <line x1="80" y1="164" x2="1200" y2="164" stroke="#e9ecef"/>
  <text x="104" y="143" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">DATA</text>
  <text x="250" y="143" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">OBXECTO</text>
  <text x="596" y="143" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">ESTADO</text>
  <text x="736" y="143" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">ADXUDICATARIO</text>
  <text x="1112" y="143" text-anchor="end" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">IMPORTE</text>
  <text x="1176" y="143" text-anchor="end" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">FONTE</text>

  <text x="104" y="202" font-size="15" font-weight="500" fill="#212529">4 mar 2025</text>
  <text x="104" y="226" font-size="12.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#adb5bd">2025/0198220</text>
  <text x="250" y="202" font-size="15" fill="#212529">Servizo de limpeza dos centros de saúde</text>
  <text x="250" y="226" font-size="15" fill="#212529">da área sanitaria de Pontevedra</text>
  <rect x="596" y="190" width="118" height="26" rx="13" fill="#f1f3f5"/>
  <text x="655" y="203" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" letter-spacing="0.4" fill="#495057">ADXUDICADA</text>
  <text x="736" y="206" font-size="15" fill="#495057">3 adxudicatarios</text>
  <text x="1112" y="202" text-anchor="end" font-size="15.5" font-weight="600" fill="#212529">842.300,00 €</text>
  <text x="1112" y="226" text-anchor="end" font-size="12" fill="#868e96">Adxudicado en parte</text>
  <g stroke="#4c6ef5" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1168 197 h-9 v16 h16 v-9 M1170 195 h7 v7 M1177 195 l-9 9"/>
  </g>

  <!-- markers -->
  <circle cx="212" cy="197" r="9" fill="#4c6ef5"/>
  <text x="212" y="197" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">1</text>
  <circle cx="212" cy="223" r="9" fill="#4c6ef5"/>
  <text x="212" y="223" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">2</text>
  <circle cx="259" cy="258" r="9" fill="#4c6ef5"/>
  <text x="259" y="258" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">3</text>
  <circle cx="605" cy="258" r="9" fill="#4c6ef5"/>
  <text x="605" y="258" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">4</text>
  <circle cx="745" cy="258" r="9" fill="#4c6ef5"/>
  <text x="745" y="258" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">5</text>
  <circle cx="1100" cy="258" r="9" fill="#4c6ef5"/>
  <text x="1100" y="258" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">6</text>
  <circle cx="1167" cy="258" r="9" fill="#4c6ef5"/>
  <text x="1167" y="258" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">7</text>

  <!-- ===== legend, left column ===== -->
  <circle cx="89" cy="334" r="9" fill="#4c6ef5"/>
  <text x="89" y="334" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">1</text>
  <text x="108" y="338" font-size="13" font-weight="600" fill="#212529">Data de publicación</text>
  <text x="108" y="360" font-size="11.5" fill="#868e96">É o único que decide se unha licitación se ve. Non fai falta nin</text>
  <text x="108" y="377" font-size="11.5" fill="#868e96">adxudicación, nin importe, nin adxudicatario resolto: aí é onde esta</text>
  <text x="108" y="394" font-size="11.5" fill="#868e96">familia máis se afasta dos contratos menores, que retiran a fila enteira</text>
  <text x="108" y="411" font-size="11.5" fill="#868e96">se lle falta calquera das tres cousas.</text>

  <circle cx="89" cy="438" r="9" fill="#4c6ef5"/>
  <text x="89" y="438" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">2</text>
  <text x="108" y="442" font-size="13" font-weight="600" fill="#212529">Identificador de publicación</text>
  <text x="108" y="464" font-size="11.5" fill="#868e96">Tal e como o publica a fonte, e o desempate de todas as ordes: sen el,</text>
  <text x="108" y="481" font-size="11.5" fill="#868e96">«a páxina seguinte» non denota, porque moitas licitacións do mesmo</text>
  <text x="108" y="498" font-size="11.5" fill="#868e96">órgano comparten día. Ordénase como texto, así que entre dous do</text>
  <text x="108" y="515" font-size="11.5" fill="#868e96">mesmo día «9» vai despois de «10». O custo está escrito, non agochado.</text>

  <circle cx="89" cy="542" r="9" fill="#4c6ef5"/>
  <text x="89" y="542" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">3</text>
  <text x="108" y="546" font-size="13" font-weight="600" fill="#212529">Obxecto</text>
  <text x="108" y="568" font-size="11.5" fill="#868e96">Exactamente como está gardado: sen truncar, sen recortar e sen</text>
  <text x="108" y="585" font-size="11.5" fill="#868e96">reformatar. Envolve en varias liñas se fai falta, e se a fonte non publicou</text>
  <text x="108" y="602" font-size="11.5" fill="#868e96">ningún, a cela queda baleira. Nin expediente, nin valor estimado, nin tipo,</text>
  <text x="108" y="619" font-size="11.5" fill="#868e96">nin número de lotes: iso é a páxina de detalle da licitación.</text>

  <circle cx="89" cy="646" r="9" fill="#4c6ef5"/>
  <text x="89" y="646" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">4</text>
  <text x="108" y="650" font-size="13" font-weight="600" fill="#212529">Estado</text>
  <text x="108" y="672" font-size="11.5" fill="#868e96">A etiqueta da fonte, pero a identidade é o código. Dous estados poden</text>
  <text x="108" y="689" font-size="11.5" fill="#868e96">compartir etiqueta —101 e 102 son os dous «Histórico»— e a etiqueta</text>
  <text x="108" y="706" font-size="11.5" fill="#868e96">pode faltar de todo: entón amósase o código, non unha cela baleira.</text>
  <text x="108" y="723" font-size="11.5" fill="#868e96">Sempre gris: o vocabulario é da fonte, e colorealo sería inventarlle sentido.</text>

  <!-- ===== legend, right column ===== -->
  <circle cx="669" cy="334" r="9" fill="#4c6ef5"/>
  <text x="669" y="334" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">5</text>
  <text x="688" y="338" font-size="13" font-weight="600" fill="#212529">Adxudicatario, ou cantos son</text>
  <text x="688" y="360" font-size="11.5" fill="#868e96">Nómase só cando hai exactamente un, co seu nome e o seu identificador</text>
  <text x="688" y="377" font-size="11.5" fill="#868e96">fiscal se o ten —unha UTE sen identificar nómase igual, sen o número—.</text>
  <text x="688" y="394" font-size="11.5" fill="#868e96">Con máis dun, dise cantos. Unha parte que non se puido resolver non se</text>
  <text x="688" y="411" font-size="11.5" fill="#868e96">conta, e ningunha fila amosa un nome publicado sen resolver.</text>

  <circle cx="669" cy="438" r="9" fill="#4c6ef5"/>
  <text x="669" y="438" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">6</text>
  <text x="688" y="442" font-size="13" font-weight="600" fill="#212529">Importe, e que importe é</text>
  <text x="688" y="464" font-size="11.5" fill="#868e96">Unha cifra e a base que a nomea. O servidor decide cal das tres é; a fila</text>
  <text x="688" y="481" font-size="11.5" fill="#868e96">nin suma, nin mestura, nin substitúe. Ordenar por importe ordena por</text>
  <text x="688" y="498" font-size="11.5" fill="#868e96">esa mesma cifra, sexa adxudicación ou orzamento — ordenar non afirma</text>
  <text x="688" y="515" font-size="11.5" fill="#868e96">que sexan comparables, e sumalas si o faría.</text>

  <circle cx="669" cy="542" r="9" fill="#4c6ef5"/>
  <text x="669" y="542" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#ffffff">7</text>
  <text x="688" y="546" font-size="13" font-weight="600" fill="#212529">Fonte</text>
  <text x="688" y="568" font-size="11.5" fill="#868e96">Unha ligazón á publicación oficial. Como é unha icona soa, o seu nome</text>
  <text x="688" y="585" font-size="11.5" fill="#868e96">accesible nomea a licitación que abre; se non, cincuenta filas ofrecerían</text>
  <text x="688" y="602" font-size="11.5" fill="#868e96">cincuenta ligazóns co mesmo nome. Un debuxo non pode amosalo, e a</text>
  <text x="688" y="619" font-size="11.5" fill="#868e96">tarefa que o constrúa non o pode saltar.</text>

  <rect x="688" y="644" width="512" height="82" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <text x="708" y="670" font-size="12" font-weight="600" fill="#495057">O que a fila non di, e non por descoido</text>
  <text x="708" y="692" font-size="11.5" fill="#868e96">Ningunha columna nomea o órgano adxudicador: todas as filas son do</text>
  <text x="708" y="709" font-size="11.5" fill="#868e96">órgano que xa está aberto. E nada leva ao detalle, porque aínda non existe.</text>

  <text x="80" y="762" font-size="11.5" fill="#adb5bd">As datas e os decimais renderízanse en galego; iso é presentación. «Exactamente como está gardado» rexe o texto que a fonte publica, non o formato dun número.</text>
</svg>
