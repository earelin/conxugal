  <!-- ===== annotations ===== -->
  <rect x="284" y="848" width="308" height="140" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <circle cx="304" cy="870" r="10" fill="#4c6ef5"/>
  <text x="304" y="870" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="322" y="874" font-size="12" font-weight="600" fill="#495057">A segunda lapela, e nada máis</text>
  <text x="302" y="898" font-size="11.5" fill="#868e96">O nome e a barra son de FEAT-0013. Esta</text>
  <text x="302" y="915" font-size="11.5" fill="#868e96">familia engade unha entrada ao rexistro e</text>
  <text x="302" y="932" font-size="11.5" fill="#868e96">unha ruta filla; contratos menores segue</text>
  <text x="302" y="949" font-size="11.5" fill="#868e96">primeira, así que /organo/:id abre onde abría.</text>
  <text x="302" y="972" font-size="11" fill="#adb5bd">A sección non le o órgano por ningunha banda.</text>

  <rect x="616" y="848" width="308" height="140" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <circle cx="636" cy="870" r="10" fill="#4c6ef5"/>
  <text x="636" y="870" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="654" y="874" font-size="12" font-weight="600" fill="#495057">Un ano, dous filtros, unha orde</text>
  <text x="634" y="898" font-size="11.5" fill="#868e96">O ano é obrigatorio e non ofrece nada que</text>
  <text x="634" y="915" font-size="11.5" fill="#868e96">non sexa un ano. CPV e estado son opcionais</text>
  <text x="634" y="932" font-size="11.5" fill="#868e96">e ofrecen só o que ese ano contén. A orde é</text>
  <text x="634" y="949" font-size="11.5" fill="#868e96">un conxunto pechado de catro entradas.</text>
  <text x="634" y="972" font-size="11" fill="#adb5bd">Tocar calquera dos catro volve á páxina 1.</text>

  <rect x="948" y="848" width="308" height="140" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <circle cx="968" cy="870" r="10" fill="#4c6ef5"/>
  <text x="968" y="870" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="986" y="874" font-size="12" font-weight="600" fill="#495057">Cada importe di que importe é</text>
  <text x="966" y="898" font-size="11.5" fill="#868e96">Adxudicado, adxudicado en parte, ou</text>
  <text x="966" y="915" font-size="11.5" fill="#868e96">orzamento base con IVE dito. Nunca os dous,</text>
  <text x="966" y="932" font-size="11.5" fill="#868e96">nunca unha mestura, e nunca un cero no</text>
  <text x="966" y="949" font-size="11.5" fill="#868e96">canto dun importe que ninguén publicou.</text>
  <text x="966" y="972" font-size="11" fill="#adb5bd">O servidor manda a cifra e a base; a fila non calcula.</text>
</svg>
