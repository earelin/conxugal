<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1280" height="880" fill="#f8f9fa"/>

  <text x="40" y="60" font-size="22" font-weight="700" fill="#212529">A barra: un ano, dous estreitamentos e unha orde</text>
  <text x="40" y="84" font-size="13" fill="#868e96">Os catro controis abertos á vez, que na aplicación nunca ocorre. O ano é obrigatorio; o CPV e o estado son opcionais e limpables; a orde é un conxunto pechado.</text>
  <text x="40" y="103" font-size="13" fill="#868e96">Ningún dos catro inventa vocabulario: o CPV e o estado ofrecen só o que ese ano contén, e a orde ofrece exactamente as catro consultas que o servidor sabe facer.</text>

  <!-- ===== ANO ===== -->
  <text x="40" y="160" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">ANO</text>
  <rect x="40" y="170" width="180" height="36" rx="8" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="56" y="193" font-size="14" font-weight="500" fill="#212529">2025</text>
  <path d="M190 190 l6 -6 l6 6" stroke="#868e96" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="216" width="180" height="176" rx="8" fill="#212529" opacity="0.06"/>
  <rect x="40" y="214" width="180" height="176" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="44" y="222" width="172" height="32" rx="6" fill="#edf2ff"/>
  <text x="56" y="238" dominant-baseline="central" font-size="13" font-weight="600" fill="#3b5bdb">2025</text>
  <text x="56" y="270" dominant-baseline="central" font-size="13" fill="#212529">2024</text>
  <text x="56" y="302" dominant-baseline="central" font-size="13" fill="#212529">2023</text>
  <text x="56" y="334" dominant-baseline="central" font-size="13" fill="#212529">2022</text>
  <text x="56" y="366" dominant-baseline="central" font-size="13" fill="#212529">2019</text>

  <!-- ===== CPV ===== -->
  <text x="244" y="160" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">CPV</text>
  <rect x="244" y="170" width="300" height="36" rx="8" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="260" y="188" font-size="12.5" font-weight="500" fill="#212529">33690000</text>
  <text x="260" y="201" font-size="10" fill="#868e96">Produtos farmacéuticos diversos</text>
  <g stroke="#868e96" stroke-width="1.5" stroke-linecap="round">
    <path d="M494 184 l8 8 M502 184 l-8 8"/>
  </g>
  <path d="M516 190 l6 -6 l6 6" stroke="#868e96" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="244" y="216" width="300" height="192" rx="8" fill="#212529" opacity="0.06"/>
  <rect x="244" y="214" width="300" height="192" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="260" y="244" dominant-baseline="central" font-size="12.5" fill="#868e96">Todos os CPV</text>
  <rect x="248" y="266" width="292" height="44" rx="6" fill="#edf2ff"/>
  <text x="260" y="281" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#3b5bdb">33690000</text>
  <text x="260" y="297" dominant-baseline="central" font-size="10.5" fill="#5c7cfa">Produtos farmacéuticos diversos</text>
  <text x="260" y="325" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#212529">45215140</text>
  <text x="260" y="341" dominant-baseline="central" font-size="10.5" fill="#868e96">Obras de instalacións hospitalarias</text>
  <text x="260" y="376" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#212529">90910000</text>

  <!-- ===== ESTADO ===== -->
  <text x="568" y="160" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">ESTADO</text>
  <rect x="568" y="170" width="288" height="36" rx="8" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="584" y="193" font-size="12.5" fill="#adb5bd">Todos os estados</text>
  <path d="M828 190 l6 -6 l6 6" stroke="#868e96" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="568" y="216" width="288" height="208" rx="8" fill="#212529" opacity="0.06"/>
  <rect x="568" y="214" width="288" height="208" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="572" y="222" width="280" height="32" rx="6" fill="#edf2ff"/>
  <text x="584" y="238" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#3b5bdb">Todos os estados</text>
  <text x="584" y="270" dominant-baseline="central" font-size="13" fill="#212529">Aberta</text>
  <text x="840" y="270" text-anchor="end" dominant-baseline="central" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#adb5bd">2</text>
  <text x="584" y="302" dominant-baseline="central" font-size="13" fill="#212529">Adxudicada</text>
  <text x="840" y="302" text-anchor="end" dominant-baseline="central" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#adb5bd">8</text>
  <text x="584" y="334" dominant-baseline="central" font-size="13" fill="#212529">Histórico</text>
  <text x="840" y="334" text-anchor="end" dominant-baseline="central" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#adb5bd">101</text>
  <text x="584" y="366" dominant-baseline="central" font-size="13" fill="#212529">Histórico</text>
  <text x="840" y="366" text-anchor="end" dominant-baseline="central" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#adb5bd">102</text>
  <text x="584" y="398" dominant-baseline="central" font-size="13" fill="#212529">Estado 137</text>
  <text x="840" y="398" text-anchor="end" dominant-baseline="central" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#adb5bd">137</text>
  <rect x="574" y="320" width="276" height="62" rx="6" fill="none" stroke="#4c6ef5" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- ===== ORDENAR POR ===== -->
  <text x="880" y="160" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">ORDENAR POR</text>
  <rect x="880" y="170" width="340" height="36" rx="8" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="896" y="193" font-size="12.5" font-weight="500" fill="#212529">Data de publicación (máis recente primeiro)</text>
  <path d="M1192 190 l6 -6 l6 6" stroke="#868e96" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="880" y="216" width="340" height="144" rx="8" fill="#212529" opacity="0.06"/>
  <rect x="880" y="214" width="340" height="144" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="884" y="222" width="332" height="32" rx="6" fill="#edf2ff"/>
  <text x="896" y="238" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#3b5bdb">Data de publicación (máis recente primeiro)</text>
  <text x="896" y="270" dominant-baseline="central" font-size="12.5" fill="#212529">Data de publicación (máis antiga primeiro)</text>
  <text x="896" y="302" dominant-baseline="central" font-size="12.5" fill="#212529">Importe (maior primeiro)</text>
  <text x="896" y="334" dominant-baseline="central" font-size="12.5" fill="#212529">Importe (menor primeiro)</text>

  <!-- ===== annotations ===== -->
  <rect x="40" y="450" width="584" height="132" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <text x="64" y="478" font-size="12.5" font-weight="600" fill="#495057">O ano manda, e o CPV é unha lista de códigos</text>
  <text x="64" y="502" font-size="11.5" fill="#868e96">Os anos que se ofrecen son os que teñen licitacións visibles, e nada máis: nin</text>
  <text x="64" y="519" font-size="11.5" fill="#868e96">«todos os anos», nin «sen data». O oco entre 2022 e 2019 é normal e non é un erro.</text>
  <text x="64" y="541" font-size="11.5" fill="#868e96">O CPV lese como lista de códigos coa descrición de adorno, porque a descrición pode</text>
  <text x="64" y="558" font-size="11.5" fill="#868e96">faltar — 90910000 aquí arriba. Unha lista de descricións degradaría a ocos brancos.</text>

  <rect x="656" y="450" width="584" height="132" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <text x="680" y="478" font-size="12.5" font-weight="600" fill="#495057">Dous «Histórico» son dúas escollas distintas</text>
  <text x="680" y="502" font-size="11.5" fill="#868e96">Os códigos 101 e 102 comparten etiqueta. O valor de cada entrada é o código, e a</text>
  <text x="680" y="519" font-size="11.5" fill="#868e96">etiqueta é só o que se le; un control indexado pola etiqueta fusionaría dous estados</text>
  <text x="680" y="536" font-size="11.5" fill="#868e96">que a fonte distingue, pasaría todas as demais probas, e fallaría só como «filas que</text>
  <text x="680" y="553" font-size="11.5" fill="#868e96">non son». Un estado sen etiqueta ofrécese polo seu código, nunca en branco.</text>

  <!-- ===== the empty selection ===== -->
  <text x="40" y="622" font-size="12" font-weight="600" letter-spacing="0.5" fill="#495057">CANDO OS DOUS FILTROS XUNTOS BALEIRAN A LISTA</text>
  <rect x="40" y="640" width="1200" height="180" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="40" y="638" width="1200" height="180" rx="8" fill="#ffffff" stroke="#dee2e6"/>

  <rect x="72" y="670" width="112" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="88" y="692" font-size="13" font-weight="500" fill="#212529">2025</text>
  <path d="M158 684 l5 5 l5 -5" stroke="#868e96" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="670" width="200" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="216" y="692" font-size="12.5" font-weight="500" fill="#212529">90910000</text>
  <g stroke="#868e96" stroke-width="1.5" stroke-linecap="round">
    <path d="M354 683 l8 8 M362 683 l-8 8"/>
  </g>
  <path d="M374 684 l5 5 l5 -5" stroke="#868e96" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="416" y="670" width="200" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="432" y="692" font-size="12.5" font-weight="500" fill="#212529">Histórico</text>
  <text x="536" y="692" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#adb5bd">102</text>
  <g stroke="#868e96" stroke-width="1.5" stroke-linecap="round">
    <path d="M570 683 l8 8 M578 683 l-8 8"/>
  </g>
  <path d="M590 684 l5 5 l5 -5" stroke="#868e96" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="40" y1="726" x2="1240" y2="726" stroke="#f1f3f5"/>
  <text x="72" y="756" font-size="13" fill="#adb5bd">— ningunha licitación coincide —</text>
  <text x="72" y="790" font-size="12.5" fill="#868e96">0 rexistros</text>

  <text x="656" y="756" font-size="11.5" fill="#868e96">Escoller un só filtro nunca pode baleirar a lista, porque cada un ofrece só o que ese ano</text>
  <text x="656" y="773" font-size="11.5" fill="#868e96">contén. Escoller os dous si pode, e por iso os dous controis quedan cheos e limpables:</text>
  <text x="656" y="790" font-size="11.5" fill="#868e96">quen le ten que poder desfacer a escolla que baleirou a lista.</text>

  <text x="40" y="856" font-size="11.5" fill="#adb5bd">Tocar calquera dos catro controis reescribe a URL e tira a páxina. É unha regra soa nun sitio só: se vivise en cada control, habería catro sitios onde esquecela.</text>
</svg>
