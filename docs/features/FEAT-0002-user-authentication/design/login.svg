<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="13"/>
    </filter>
  </defs>

  <!-- ===== standalone page (outside the SPA shell) ===== -->
  <rect width="1280" height="840" fill="#f8f9fa"/>

  <!-- ===== brand (logo tile from ui/public/logo.svg — paths unchanged) ===== -->
  <g transform="translate(618,124) scale(0.22)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="#4c6ef5"/>
    <path d="M 132 55 A 56 56 0 1 0 132 145" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    <path d="M 112 100 L 176 100" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round"/>
    <path d="M 156 80 L 178 100 L 156 120" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="640" y="196" text-anchor="middle" font-size="26" font-weight="700" fill="#212529">conxugal</text>
  <text x="640" y="218" text-anchor="middle" font-size="12" fill="#868e96">Contratos públicos da Xunta de Galicia</text>

  <!-- ===== login card ===== -->
  <rect x="430" y="256" width="420" height="400" rx="12" fill="#000000" opacity="0.10" filter="url(#cardShadow)"/>
  <rect x="430" y="248" width="420" height="400" rx="12" fill="#ffffff" stroke="#e9ecef"/>

  <text x="462" y="296" font-size="20" font-weight="600" fill="#212529">Inicia sesión</text>
  <text x="462" y="320" font-size="13" fill="#868e96">Accede coa túa conta para continuar.</text>

  <!-- generic error (the /login?error state — reveals nothing about which field) -->
  <rect x="462" y="336" width="356" height="44" rx="8" fill="#fff5f5" stroke="#ffc9c9"/>
  <path d="M484 350 L490 362 L478 362 Z" fill="none" stroke="#fa5252" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="484" y1="354" x2="484" y2="358" stroke="#fa5252" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="484" cy="360.5" r="0.9" fill="#fa5252"/>
  <text x="502" y="358" dominant-baseline="central" font-size="12.5" fill="#c92a2a">Correo electrónico ou contrasinal incorrectos.</text>

  <!-- field: email -->
  <text x="462" y="410" font-size="13" font-weight="600" fill="#212529">Correo electrónico</text>
  <rect x="462" y="420" width="356" height="44" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="478" y="442" dominant-baseline="central" font-size="14" fill="#adb5bd">persoa@dominio.gal</text>

  <!-- field: password -->
  <text x="462" y="488" font-size="13" font-weight="600" fill="#212529">Contrasinal</text>
  <rect x="462" y="498" width="356" height="44" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <g fill="#495057">
    <circle cx="482" cy="520" r="3"/><circle cx="494" cy="520" r="3"/><circle cx="506" cy="520" r="3"/>
    <circle cx="518" cy="520" r="3"/><circle cx="530" cy="520" r="3"/><circle cx="542" cy="520" r="3"/>
    <circle cx="554" cy="520" r="3"/><circle cx="566" cy="520" r="3"/>
  </g>
  <g stroke="#868e96" stroke-width="1.5" fill="none">
    <path d="M792 520 c3 -5 9 -5 12 0 c-3 5 -9 5 -12 0 z"/>
    <circle cx="798" cy="520" r="2" fill="#868e96" stroke="none"/>
  </g>

  <!-- submit -->
  <rect x="462" y="566" width="356" height="46" rx="8" fill="#4c6ef5"/>
  <text x="640" y="589" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#ffffff">Entrar</text>

  <!-- footer note -->
  <g stroke="#adb5bd" stroke-width="1.4" fill="none">
    <rect x="503" y="678" width="11" height="8" rx="1.5"/>
    <path d="M505 678 v-2 a3.5 3.5 0 0 1 7 0 v2"/>
  </g>
  <text x="523" y="685" font-size="12" fill="#868e96">Acceso restrinxido ao persoal autorizado.</text>
</svg>
