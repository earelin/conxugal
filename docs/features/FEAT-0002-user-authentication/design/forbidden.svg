<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- ===== standalone error page (outside the SPA shell) ===== -->
  <rect width="1280" height="840" fill="#f8f9fa"/>

  <!-- brand (logo tile from ui/public/logo.svg — paths unchanged) -->
  <g transform="translate(625,70) scale(0.15)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="#4c6ef5"/>
    <path d="M 132 55 A 56 56 0 1 0 132 145" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    <path d="M 112 100 L 176 100" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round"/>
    <path d="M 156 80 L 178 100 L 156 120" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="640" y="124" text-anchor="middle" font-size="18" font-weight="700" fill="#212529">conxugal</text>

  <!-- status glyph: lock -->
  <circle cx="640" cy="310" r="76" fill="#edf2ff"/>
  <g stroke="#4c6ef5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="618" y="306" width="44" height="34" rx="6"/>
    <path d="M626 306 v-9 a14 14 0 0 1 28 0 v9"/>
  </g>
  <circle cx="640" cy="320" r="3.2" fill="#4c6ef5"/>
  <line x1="640" y1="320" x2="640" y2="329" stroke="#4c6ef5" stroke-width="2.4" stroke-linecap="round"/>

  <!-- code + title -->
  <text x="640" y="432" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#4c6ef5">ERRO 403</text>
  <text x="640" y="468" text-anchor="middle" font-size="26" font-weight="700" fill="#212529">Acceso denegado</text>

  <!-- description -->
  <text x="640" y="502" text-anchor="middle" font-size="14" fill="#868e96">A túa conta non ten permisos para acceder a esta área.</text>
  <text x="640" y="522" text-anchor="middle" font-size="14" fill="#868e96">Contacta cun administrador se cres que se trata dun erro.</text>

  <!-- primary action -->
  <rect x="540" y="558" width="200" height="46" rx="8" fill="#4c6ef5"/>
  <text x="640" y="581" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#ffffff">Volver ao inicio</text>

  <!-- secondary action -->
  <text x="640" y="634" text-anchor="middle" font-size="13" font-weight="500" fill="#4c6ef5">Pechar sesión</text>

  <!-- footer -->
  <text x="640" y="760" text-anchor="middle" font-size="12" fill="#adb5bd">conxugal · Contratos públicos da Xunta de Galicia</text>
</svg>
