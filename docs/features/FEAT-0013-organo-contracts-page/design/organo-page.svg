<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- ===== app background & AppShell frame ===== -->
  <rect width="1280" height="840" fill="#f8f9fa"/>
  <rect x="0" y="0" width="1280" height="60" fill="#ffffff"/>
  <rect x="0" y="60" width="260" height="780" fill="#ffffff"/>
  <line x1="0" y1="60" x2="1280" y2="60" stroke="#dee2e6" stroke-width="1"/>
  <line x1="260" y1="60" x2="260" y2="840" stroke="#dee2e6" stroke-width="1"/>

  <!-- ===== header ===== -->
  <g transform="translate(24,12) scale(0.18)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="#4c6ef5"/>
    <path d="M 132 55 A 56 56 0 1 0 132 145" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    <path d="M 112 100 L 176 100" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round"/>
    <path d="M 156 80 L 178 100 L 156 120" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="72" y="31" font-size="20" font-weight="700" fill="#212529">conxugal</text>
  <text x="72" y="47" font-size="11" fill="#868e96">Contratos públicos da Xunta de Galicia</text>
  <line x1="1148" y1="16" x2="1148" y2="44" stroke="#e9ecef" stroke-width="1"/>
  <text x="1210" y="26" text-anchor="end" font-size="13" font-weight="500" fill="#495057">xoan.rivas@conxugal.gal</text>
  <text x="1210" y="42" text-anchor="end" font-size="11" fill="#868e96">Usuario</text>
  <circle cx="1236" cy="30" r="18" fill="#4c6ef5"/>
  <text x="1236" y="30" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#ffffff">XR</text>

  <!-- ===== navbar: FEAT-0012's picker, closed, naming the open Órgano ===== -->
  <text x="24" y="92" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">ÓRGANO</text>
  <rect x="12" y="104" width="236" height="44" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="28" y="131" font-size="13" font-weight="600" fill="#212529">Servizo Galego de Saúde</text>
  <path d="M222 123 l6 6 l6 -6" stroke="#868e96" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="12" y1="166" x2="248" y2="166" stroke="#f1f3f5"/>

  <g transform="translate(0,84)">
    <g stroke="#868e96" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M27 111 L37 102 L47 111 M29.5 108.5 V119 H44.5 V108.5" transform="translate(-3,-1)"/>
    </g>
    <text x="52" y="106" font-size="14" fill="#495057">Inicio</text>
    <g stroke="#868e96" stroke-width="1.6" fill="none">
      <circle cx="34" cy="149" r="8"/>
      <line x1="34" y1="147" x2="34" y2="153" stroke-linecap="round"/>
      <circle cx="34" cy="143.5" r="0.6" fill="#868e96" stroke="none"/>
    </g>
    <text x="52" y="154" font-size="14" fill="#495057">Acerca de</text>
  </g>

  <!-- marker 1: the picker is how a reader gets here -->
  <circle cx="236" cy="100" r="10" fill="#4c6ef5"/>
  <text x="236" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">1</text>

  <!-- ===== the page: the Órgano's name and the tab bar, and nothing else ===== -->
  <text x="284" y="118" font-size="26" font-weight="700" fill="#212529">Servizo Galego de Saúde</text>

  <line x1="284" y1="190" x2="1256" y2="190" stroke="#dee2e6"/>
  <text x="368" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#3b5bdb">Contratos menores</text>
  <rect x="284" y="188" width="168" height="3" fill="#4c6ef5"/>

  <!-- marker 2: the bar -->
  <circle cx="480" cy="169" r="10" fill="#4c6ef5"/>
  <text x="480" y="169" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">2</text>

  <!-- ===== the outlet: this feature draws the frame, never the contents ===== -->
  <rect x="284" y="214" width="972" height="420" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="6 5"/>
  <circle cx="310" cy="240" r="10" fill="#4c6ef5"/>
  <text x="310" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">3</text>

  <text x="770" y="386" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.6" fill="#adb5bd">OUTLET</text>
  <text x="770" y="416" text-anchor="middle" font-size="16" font-weight="600" fill="#495057">Aquí móntase a sección da familia activa</text>
  <text x="770" y="444" text-anchor="middle" font-size="12.5" fill="#868e96">A sección de contratos menores é de FEAT-0011: o seu selector de ano, as súas ordenacións, as súas</text>
  <text x="770" y="462" text-anchor="middle" font-size="12.5" fill="#868e96">filas e a súa paxinación. Esta páxina non debuxa ningún contrato nin chama a ningunha lectura de</text>
  <text x="770" y="480" text-anchor="middle" font-size="12.5" fill="#868e96">contratos: entrega o marco, o nome e a lapela, e cede o interior.</text>
  <text x="770" y="510" text-anchor="middle" font-size="12" fill="#adb5bd">A tarefa 2 entrega a páxina co outlet baleiro; a tarefa 3 declara a ruta filla que o enche.</text>

  <!-- ===== annotations ===== -->
  <rect x="284" y="670" width="308" height="150" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <circle cx="304" cy="692" r="10" fill="#4c6ef5"/>
  <text x="304" y="692" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="322" y="696" font-size="12" font-weight="600" fill="#495057">Chégase desde o selector</text>
  <text x="302" y="720" font-size="11.5" fill="#868e96">Escoller un órgano no panel lateral navega a</text>
  <text x="302" y="737" font-size="11.5" fill="#868e96">/organo/&#123;id&#125;. É o único punto no que esta</text>
  <text x="302" y="754" font-size="11.5" fill="#868e96">páxina e FEAT-0012 se tocan, e vai nunha soa</text>
  <text x="302" y="771" font-size="11.5" fill="#868e96">dirección: a páxina non sabe que existe un</text>
  <text x="302" y="788" font-size="11.5" fill="#868e96">selector, e o selector non sabe que hai lapelas.</text>

  <rect x="616" y="670" width="308" height="150" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <circle cx="636" cy="692" r="10" fill="#4c6ef5"/>
  <text x="636" y="692" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="654" y="696" font-size="12" font-weight="600" fill="#495057">A barra sae das claves de families</text>
  <text x="634" y="720" font-size="11.5" fill="#868e96">Unha soa lectura, GET /api/organo/&#123;id&#125;, trae o</text>
  <text x="634" y="737" font-size="11.5" fill="#868e96">nome, as lapelas e o resumo da sección que</text>
  <text x="634" y="754" font-size="11.5" fill="#868e96">abre. A páxina le só as claves; cada valor é</text>
  <text x="634" y="771" font-size="11.5" fill="#868e96">opaco para ela. Unha soa lapela non é un</text>
  <text x="634" y="788" font-size="11.5" fill="#868e96">defecto: a seguinte familia engádese á barra.</text>

  <rect x="948" y="670" width="308" height="150" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <circle cx="968" cy="692" r="10" fill="#4c6ef5"/>
  <text x="968" y="692" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="986" y="696" font-size="12" font-weight="600" fill="#495057">A familia é unha ruta filla</text>
  <text x="966" y="720" font-size="11.5" fill="#868e96">/organo/&#123;id&#125;/contratos-menores, declarada en</text>
  <text x="966" y="737" font-size="11.5" fill="#868e96">app/router.tsx, que si pode importar as dúas</text>
  <text x="966" y="754" font-size="11.5" fill="#868e96">slices. O resumo da familia activa chega á</text>
  <text x="966" y="771" font-size="11.5" fill="#868e96">sección como contexto do outlet: sen segunda</text>
  <text x="966" y="788" font-size="11.5" fill="#868e96">petición e sen que ningunha importe a outra.</text>
</svg>
