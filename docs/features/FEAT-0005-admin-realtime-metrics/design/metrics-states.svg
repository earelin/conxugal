  <text x="40" y="194" font-size="11" fill="#868e96">non chegou ningunha mostra.</text>
  <text x="40" y="212" font-size="11" fill="#868e96">O panel amosa esqueletos:</text>
  <text x="40" y="230" font-size="11" fill="#868e96">non se agocha nin se substitúe</text>
  <text x="40" y="248" font-size="11" fill="#868e96">por un erro.</text>

