    <text x="480" y="190" font-size="11" fill="#868e96">Liña base hairline (gray.1)</text>
    <text x="48" y="196" font-size="11" fill="#868e96">Liña indigo de 2 px · 30 mostras · sen eixes nin grade</text>

    <!-- rules -->
    <circle cx="726" cy="80" r="2" fill="#adb5bd"/>
    <text x="740" y="84" font-size="12" fill="#495057">Buffer de 30 mostras: ao chegar a 31.ª, descártase a máis antiga.</text>
    <circle cx="726" cy="106" r="2" fill="#adb5bd"/>
    <text x="740" y="110" font-size="12" fill="#495057">A cadencia decídea o servidor (cada 5 s); o cliente non a escolle.</text>
    <circle cx="726" cy="132" r="2" fill="#adb5bd"/>
    <text x="740" y="136" font-size="12" fill="#495057">Vive no estado do compoñente: sen localStorage, cookies nin API.</text>
    <circle cx="726" cy="158" r="2" fill="#adb5bd"/>
    <text x="740" y="162" font-size="12" fill="#495057">Ao recargar ou saír, péchase o EventSource e o historial bórrase.</text>
    <circle cx="726" cy="184" r="2" fill="#adb5bd"/>
    <text x="740" y="188" font-size="12" fill="#495057">Unha soa serie por sparkline: sen lenda; o rótulo nomea o dato.</text>
