  <rect x="284" y="170" width="400" height="508" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="308" y="202" font-size="15" font-weight="600" fill="#212529">Taxonomía</text>
  <rect x="550" y="188" width="118" height="28" rx="8" fill="#4c6ef5"/>
  <g stroke="#ffffff" stroke-width="1.7" stroke-linecap="round">
    <line x1="563" y1="202" x2="575" y2="202"/><line x1="569" y1="196" x2="569" y2="208"/>
  </g>
  <text x="582" y="206" font-size="12" font-weight="600" fill="#ffffff">Novo termo</text>
  <line x1="284" y1="230" x2="684" y2="230" stroke="#f1f3f5"/>

  <path d="M300 247 l5 5 l5 -5" stroke="#868e96" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
