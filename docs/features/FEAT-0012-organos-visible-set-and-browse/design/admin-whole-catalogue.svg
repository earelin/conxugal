  <rect x="638" y="387" width="30" height="18" rx="9" fill="#f1f3f5"/>
  <text x="653" y="396" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#868e96">64</text>

  <path d="M302 425 l6 5 l-6 5" stroke="#868e96" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="435" font-size="14" font-weight="500" fill="#212529">Deputacións provinciais</text>
  <rect x="638" y="421" width="30" height="18" rx="9" fill="#f1f3f5"/>
  <text x="653" y="430" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#868e96">4</text>

  <!-- a term an administrator has just created: legitimately empty, still shown -->
  <text x="320" y="469" font-size="14" font-weight="500" fill="#212529">Portos e augas</text>
