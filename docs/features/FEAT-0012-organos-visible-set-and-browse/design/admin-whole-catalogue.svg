  <text x="653" y="252" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#868e96">18</text>

  <path d="M338 285 l6 5 l-6 5" stroke="#868e96" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="295" font-size="14" font-weight="500" fill="#212529">Consellería de Sanidade</text>
  <rect x="638" y="281" width="30" height="18" rx="9" fill="#f1f3f5"/>
  <text x="653" y="290" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#868e96">3</text>

  <!-- selected: a term whose órganos hold no visible contract — present here, pruned from the picker -->
  <rect x="296" y="304" width="372" height="34" rx="8" fill="#edf2ff"/>
  <path d="M338 323 l6 5 l-6 5" stroke="#3b5bdb" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
