  </g>

  <path d="M338 357 l6 5 l-6 5" stroke="#868e96" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="367" font-size="14" font-weight="500" fill="#212529">Consellería do Mar</text>
  <rect x="638" y="353" width="30" height="18" rx="9" fill="#f1f3f5"/>
  <text x="653" y="362" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#868e96">2</text>

