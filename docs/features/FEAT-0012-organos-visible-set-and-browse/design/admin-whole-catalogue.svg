  <text x="653" y="464" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#868e96">0</text>

  <line x1="296" y1="492" x2="668" y2="492" stroke="#e9ecef"/>

  <g stroke="#e8590c" stroke-width="1.5" fill="none">
    <rect x="300" y="508" width="14" height="11" rx="1.5"/>
    <path d="M300 513 h4 l1.5 2 h3 l1.5 -2 h4"/>
  </g>
  <text x="326" y="522" font-size="14" font-weight="500" fill="#212529">Sen clasificar</text>
  <rect x="638" y="509" width="30" height="18" rx="9" fill="#fff4e6"/>
  <text x="653" y="518" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#e8590c">12</text>

  <text x="308" y="560" font-size="12" fill="#868e96">429 órganos no catálogo</text>

  <!-- ===== content card: the selected term ===== -->
  <rect x="708" y="172" width="548" height="508" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="708" y="170" width="548" height="508" rx="8" fill="#ffffff" stroke="#dee2e6"/>

  <text x="732" y="200" font-size="12" fill="#868e96" xml:space="preserve">Taxonomía<tspan fill="#adb5bd"> › </tspan>Consellerías<tspan fill="#adb5bd"> › </tspan><tspan fill="#495057" font-weight="600">Consellería de Facenda</tspan></text>

  <rect x="762" y="228" width="104" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="814" y="245" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#495057">Renomear</text>
  <rect x="882" y="228" width="84" height="34" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="924" y="245" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#495057">Mover</text>
  <rect x="982" y="228" width="84" height="34" rx="8" fill="#ffffff" stroke="#ffc9c9"/>
  <text x="1024" y="245" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#e03131">Eliminar</text>
  <rect x="1082" y="228" width="150" height="34" rx="8" fill="#4c6ef5"/>
  <g stroke="#ffffff" stroke-width="1.7" stroke-linecap="round">
    <line x1="1099" y1="245" x2="1109" y2="245"/><line x1="1104" y1="240" x2="1104" y2="250"/>
  </g>
  <text x="1172" y="245" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#ffffff">Asignar órgano</text>

  <text x="732" y="292" font-size="22" font-weight="700" fill="#212529">Consellería de Facenda</text>
  <line x1="732" y1="308" x2="1232" y2="308" stroke="#f1f3f5"/>

  <rect x="708" y="324" width="548" height="48" fill="#f8f9fa"/>
  <line x1="708" y1="372" x2="1256" y2="372" stroke="#e9ecef"/>
  <text x="732" y="353" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">ÓRGANO</text>
  <text x="980" y="353" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">ESTADO</text>
  <text x="1232" y="353" text-anchor="end" font-size="11" font-weight="600" letter-spacing="0.5" fill="#868e96">ACCIÓNS</text>

  <text x="732" y="398" font-size="14" font-weight="500" fill="#212529">Axencia Tributaria de Galicia</text>
  <rect x="980" y="387" width="72" height="22" rx="11" fill="#ebfbee"/>
  <text x="1016" y="399" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="0.4" fill="#2b8a3e">ACTIVO</text>
  <rect x="1112" y="386" width="120" height="26" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="1172" y="399" text-anchor="middle" font-size="12" font-weight="500" fill="#495057">Quitar do termo</text>
  <line x1="732" y1="416" x2="1232" y2="416" stroke="#f1f3f5"/>

  <text x="732" y="456" font-size="14" font-weight="500" fill="#212529">Instituto Galego de Estatística</text>
  <rect x="980" y="445" width="72" height="22" rx="11" fill="#ebfbee"/>
  <text x="1016" y="457" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="0.4" fill="#2b8a3e">ACTIVO</text>
  <rect x="1112" y="444" width="120" height="26" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="1172" y="457" text-anchor="middle" font-size="12" font-weight="500" fill="#495057">Quitar do termo</text>
  <line x1="732" y1="474" x2="1232" y2="474" stroke="#f1f3f5"/>

  <text x="732" y="514" font-size="14" font-weight="500" fill="#adb5bd">Centro Informático Tributario</text>
  <rect x="980" y="503" width="80" height="22" rx="11" fill="#f1f3f5"/>
  <text x="1020" y="515" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="0.4" fill="#868e96">INACTIVO</text>
  <rect x="1112" y="502" width="120" height="26" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="1172" y="515" text-anchor="middle" font-size="12" font-weight="500" fill="#495057">Quitar do termo</text>
  <line x1="732" y1="532" x2="1232" y2="532" stroke="#f1f3f5"/>

  <text x="732" y="556" font-size="12" fill="#868e96">3 órganos neste termo · ningún deles ten contratos importados</text>

  <!-- ===== annotations ===== -->
  <g stroke="#ced4da" stroke-width="1.2" fill="none" stroke-dasharray="5 4">
    <path d="M300 700 H272 V126 H248"/>
    <path d="M770 700 V690 H500 V678"/>
    <path d="M1102 700 V692 H694 V463 H670"/>
  </g>

  <rect x="284" y="700" width="308" height="120" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <circle cx="304" cy="722" r="10" fill="#4c6ef5"/>
  <text x="304" y="722" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="322" y="726" font-size="12" font-weight="600" fill="#495057">O selector le GET /api/organos</text>
  <text x="302" y="750" font-size="11.5" fill="#868e96">Xa estreitado ao conxunto visible. A mesma</text>
  <text x="302" y="767" font-size="11.5" fill="#868e96">administradora ve aquí só os órganos con</text>
  <text x="302" y="784" font-size="11.5" fill="#868e96">algún contrato visible: o selector é o mesmo</text>
  <text x="302" y="801" font-size="11.5" fill="#868e96">control para todos, non un control de rol.</text>

  <rect x="616" y="700" width="308" height="120" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <circle cx="636" cy="722" r="10" fill="#4c6ef5"/>
  <text x="636" y="722" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="654" y="726" font-size="12" font-weight="600" fill="#495057">A administración le GET /api/admin/organos</text>
  <text x="634" y="750" font-size="11.5" fill="#868e96">A árbore, a lista de sen clasificar e a táboa de</text>
  <text x="634" y="767" font-size="11.5" fill="#868e96">órganos pasan á lectura de administración, así</text>
  <text x="634" y="784" font-size="11.5" fill="#868e96">que conservan o catálogo enteiro tras o</text>
  <text x="634" y="801" font-size="11.5" fill="#868e96">estreitamento. Aterra coa tarefa 1 ou antes.</text>

  <rect x="948" y="700" width="308" height="120" rx="8" fill="#ffffff" stroke="#ced4da" stroke-dasharray="5 4"/>
  <circle cx="968" cy="722" r="10" fill="#4c6ef5"/>
  <text x="968" y="722" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="986" y="726" font-size="12" font-weight="600" fill="#495057">Os termos baleiros seguen aquí (#14)</text>
  <text x="966" y="750" font-size="11.5" fill="#868e96">«Portos e augas» acaba de crearse e</text>
  <text x="966" y="767" font-size="11.5" fill="#868e96">«Consellería de Facenda» non ten ningún</text>
  <text x="966" y="784" font-size="11.5" fill="#868e96">órgano con contratos: ambos se amosan. Por</text>
  <text x="966" y="801" font-size="11.5" fill="#868e96">iso a poda vive na chamada do selector.</text>
</svg>
