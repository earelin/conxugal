<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Menú de usuario aberto na cabeceira — vista de escritorio</title>
  <defs>
    <filter id="menuShadow" x="-30%" y="-40%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="menuShadowBlur"/>
      <feFlood flood-color="#212529" flood-opacity="0.2"/>
      <feComposite in2="menuShadowBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== app background & AppShell frame ===== -->
  <rect width="1280" height="500" fill="#f8f9fa"/>
  <rect x="0" y="0" width="1280" height="60" fill="#ffffff"/>
  <rect x="0" y="60" width="260" height="440" fill="#ffffff"/>
  <line x1="0" y1="60" x2="1280" y2="60" stroke="#dee2e6" stroke-width="1"/>
  <line x1="260" y1="60" x2="260" y2="500" stroke="#dee2e6" stroke-width="1"/>

  <!-- ===== header: brand (unchanged) ===== -->
  <g transform="translate(24,12) scale(0.18)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="#4c6ef5"/>
    <path d="M 132 55 A 56 56 0 1 0 132 145" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    <path d="M 112 100 L 176 100" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round"/>
    <path d="M 156 80 L 178 100 L 156 120" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="72" y="31" font-size="20" font-weight="700" fill="#212529">conxugal</text>
  <text x="72" y="47" font-size="11" fill="#868e96">Contratos públicos da Xunta de Galicia</text>

  <!-- ===== header: user block, now the menu trigger (open state) ===== -->
  <rect x="1016" y="8" width="240" height="44" rx="8" fill="#f1f3f5"/>
  <text x="1180" y="26" text-anchor="end" font-size="13" font-weight="500" fill="#495057">ana.pereira@conxugal.gal</text>
  <text x="1180" y="42" text-anchor="end" font-size="11" fill="#868e96">Administradora</text>
  <circle cx="1206" cy="30" r="18" fill="#4c6ef5"/>
  <text x="1206" y="30" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#ffffff">AP</text>
  <path d="M1234 33 l6 -6 l6 6" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== navbar (unchanged, ADMIN session) ===== -->
  <g stroke="#868e96" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 111 L37 102 L47 111 M29.5 108.5 V119 H44.5 V108.5" transform="translate(-3,-1)"/>
  </g>
  <text x="52" y="106" font-size="14" fill="#495057">Inicio</text>
  <g stroke="#868e96" stroke-width="1.6" fill="none">
    <circle cx="34" cy="149" r="8"/>
    <line x1="34" y1="147" x2="34" y2="153" stroke-linecap="round"/>
    <circle cx="34" cy="143.5" r="0.6" fill="#868e96" stroke="none"/>
  </g>
  <text x="52" y="154" font-size="14" fill="#495057">Acerca de</text>

  <text x="24" y="192" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">ADMINISTRACIÓN</text>

  <rect x="12" y="206" width="236" height="42" rx="8" fill="#edf2ff"/>
  <g stroke="#4263eb" stroke-width="1.6" fill="none">
    <rect x="24" y="217" width="8" height="9" rx="1.5"/>
    <rect x="36" y="217" width="8" height="5" rx="1.5"/>
    <rect x="24" y="230" width="8" height="5" rx="1.5"/>
    <rect x="36" y="226" width="8" height="9" rx="1.5"/>
  </g>
  <text x="52" y="232" font-size="14" font-weight="600" fill="#3b5bdb">Panel</text>
  <g stroke="#868e96" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="31" cy="271" r="3"/>
    <path d="M25 283 c0 -3.5 3 -5 6 -5 s6 1.5 6 5"/>
    <circle cx="41.5" cy="273" r="2.4"/>
    <path d="M41 279 c2.5 0 4.5 1.3 4.5 4"/>
  </g>
  <text x="52" y="280" font-size="14" fill="#495057">Usuarios</text>

  <!-- ===== main: the screen underneath is untouched by this feature ===== -->
  <text x="284" y="112" font-size="26" font-weight="700" fill="#212529">Panel do sistema</text>
  <text x="284" y="138" font-size="14" fill="#868e96">Estado operativo do sistema no momento da consulta.</text>

  <rect x="284" y="164" width="972" height="92" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="284" y="162" width="972" height="92" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <circle cx="322" cy="208" r="22" fill="#ebfbee"/>
  <path d="M313 208 l6 6 l12 -13" stroke="#2f9e44" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="362" y="202" font-size="18" font-weight="600" fill="#212529">Servizo operativo</text>
  <text x="362" y="224" font-size="13" fill="#868e96">Todos os compoñentes responden con normalidade.</text>

  <rect x="284" y="276" width="476" height="140" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="284" y="274" width="476" height="140" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="308" y="306" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">SERVIZO</text>
  <circle cx="316" cy="342" r="5" fill="#40c057"/>
  <text x="330" y="350" font-size="24" font-weight="600" fill="#212529">Operativo</text>
  <rect x="648" y="296" width="88" height="24" rx="12" fill="#ebfbee"/>
  <text x="692" y="308" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="0.4" fill="#2b8a3e">EN LIÑA</text>
  <line x1="308" y1="374" x2="736" y2="374" stroke="#f1f3f5"/>
  <text x="308" y="396" font-size="12" fill="#868e96">Sen incidencias rexistradas nas últimas 24 h.</text>

  <rect x="780" y="276" width="476" height="140" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="780" y="274" width="476" height="140" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="804" y="306" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">BASE DE DATOS</text>
  <circle cx="812" cy="342" r="5" fill="#40c057"/>
  <text x="826" y="350" font-size="24" font-weight="600" fill="#212529">Accesible</text>
  <rect x="1128" y="296" width="104" height="24" rx="12" fill="#ebfbee"/>
  <text x="1180" y="308" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="0.4" fill="#2b8a3e">CONECTADA</text>
  <line x1="804" y1="374" x2="1232" y2="374" stroke="#f1f3f5"/>
  <text x="804" y="396" font-size="12" fill="#868e96">Conexión verificada na última sonda (hai 2 s).</text>

  <line x1="284" y1="450" x2="620" y2="450" stroke="#dee2e6" stroke-dasharray="4 4"/>
  <text x="770" y="454" text-anchor="middle" font-size="11" fill="#adb5bd">resto da pantalla (FEAT-0004 / FEAT-0005), sen cambios</text>
  <line x1="920" y1="450" x2="1256" y2="450" stroke="#dee2e6" stroke-dasharray="4 4"/>

  <!-- ===== the dropdown, over the page content ===== -->
  <g filter="url(#menuShadow)">
    <rect x="988" y="64" width="268" height="112" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  </g>

  <!-- identity header: repeats the account, the only naming below sm -->
  <text x="1004" y="90" font-size="13" font-weight="500" fill="#212529">ana.pereira@conxugal.gal</text>
  <text x="1004" y="108" font-size="11" fill="#868e96">Administradora</text>
  <line x1="988" y1="124" x2="1256" y2="124" stroke="#e9ecef"/>

  <!-- the single item: neutral, not red -->
  <rect x="992" y="130" width="260" height="40" rx="6" fill="#f1f3f5"/>
  <g transform="translate(1006,141) scale(0.75)" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/>
    <path d="M9 12h12l-3 -3"/>
    <path d="M18 15l3 -3"/>
  </g>
  <text x="1034" y="150" dominant-baseline="central" font-size="14" fill="#212529">Pechar sesión</text>
</svg>
