<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Menú de usuario a 360 px — disparador só con iniciais, pechado e aberto</title>
  <defs>
    <filter id="menuShadowNarrow" x="-30%" y="-40%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="menuShadowNarrowBlur"/>
      <feFlood flood-color="#212529" flood-opacity="0.2"/>
      <feComposite in2="menuShadowNarrowBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="820" height="540" fill="#ffffff"/>

  <text x="20" y="28" font-size="12" font-weight="600" fill="#212529">Pechado — 360 px</text>
  <text x="152" y="28" font-size="11" fill="#868e96">o disparador queda só coas iniciais</text>
  <text x="440" y="28" font-size="12" font-weight="600" fill="#212529">Aberto — 360 px</text>
  <text x="566" y="28" font-size="11" fill="#868e96">o despregable nomea a conta</text>

  <!-- ================= PANEL A — pechado ================= -->
  <rect x="20" y="40" width="360" height="440" fill="#f8f9fa" stroke="#dee2e6"/>

  <!-- header (navbar pregada tras a hamburguesa) -->
  <rect x="20" y="40" width="360" height="56" fill="#ffffff"/>
  <line x1="20" y1="96" x2="380" y2="96" stroke="#dee2e6"/>
  <g stroke="#495057" stroke-width="1.8" stroke-linecap="round">
    <line x1="36" y1="62" x2="52" y2="62"/>
    <line x1="36" y1="68" x2="52" y2="68"/>
    <line x1="36" y1="74" x2="52" y2="74"/>
  </g>
  <g transform="translate(68,54) scale(0.14)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="#4c6ef5"/>
    <path d="M 132 55 A 56 56 0 1 0 132 145" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    <path d="M 112 100 L 176 100" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round"/>
    <path d="M 156 80 L 178 100 L 156 120" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="104" y="74" font-size="17" font-weight="700" fill="#212529">conxugal</text>

  <!-- trigger: no email/role text below sm, but the control itself stays -->
  <circle cx="328" cy="68" r="15" fill="#4c6ef5"/>
  <text x="328" y="68" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#ffffff">AP</text>
  <path d="M343 65 l5 5 l5 -5" fill="none" stroke="#868e96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- page content -->
  <text x="36" y="138" font-size="22" font-weight="700" fill="#212529">Panel do sistema</text>
  <text x="36" y="160" font-size="12" fill="#868e96">Estado operativo do sistema.</text>

  <rect x="36" y="194" width="328" height="88" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="36" y="192" width="328" height="88" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <circle cx="72" cy="236" r="20" fill="#ebfbee"/>
  <path d="M63 236 l5.5 5.5 l11 -12" stroke="#2f9e44" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="230" font-size="15" font-weight="600" fill="#212529">Servizo operativo</text>
  <text x="104" y="250" font-size="11" fill="#868e96">Todos os compoñentes responden ben.</text>

  <rect x="36" y="298" width="328" height="116" rx="8" fill="#212529" opacity="0.05"/>
