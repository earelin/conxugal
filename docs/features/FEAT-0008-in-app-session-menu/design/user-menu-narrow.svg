  <text x="82" y="370" font-size="22" font-weight="600" fill="#212529">Operativo</text>
  <rect x="264" y="316" width="84" height="22" rx="11" fill="#ebfbee"/>
  <text x="306" y="327" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="0.4" fill="#2b8a3e">EN LIÑA</text>
  <line x1="60" y1="392" x2="340" y2="392" stroke="#f1f3f5"/>
  <text x="60" y="410" font-size="11" fill="#868e96">Sen incidencias nas últimas 24 h.</text>

  <line x1="36" y1="444" x2="120" y2="444" stroke="#dee2e6" stroke-dasharray="4 4"/>
  <text x="200" y="448" text-anchor="middle" font-size="10" fill="#adb5bd">resto da pantalla</text>
  <line x1="280" y1="444" x2="364" y2="444" stroke="#dee2e6" stroke-dasharray="4 4"/>

  <!-- ================= PANEL B — aberto ================= -->
  <rect x="440" y="40" width="360" height="440" fill="#f8f9fa" stroke="#dee2e6"/>

  <rect x="440" y="40" width="360" height="56" fill="#ffffff"/>
  <line x1="440" y1="96" x2="800" y2="96" stroke="#dee2e6"/>
  <g stroke="#495057" stroke-width="1.8" stroke-linecap="round">
