  <text x="524" y="74" font-size="17" font-weight="700" fill="#212529">conxugal</text>

  <rect x="726" y="46" width="58" height="44" rx="8" fill="#f1f3f5"/>
  <circle cx="748" cy="68" r="15" fill="#4c6ef5"/>
  <text x="748" y="68" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#ffffff">AP</text>
  <path d="M763 70 l5 -5 l5 5" fill="none" stroke="#868e96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="456" y="138" font-size="22" font-weight="700" fill="#212529">Panel do sistema</text>
  <text x="456" y="160" font-size="12" fill="#868e96">Estado operativo do sistema.</text>

  <rect x="456" y="194" width="328" height="88" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="456" y="192" width="328" height="88" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <circle cx="492" cy="236" r="20" fill="#ebfbee"/>
  <path d="M483 236 l5.5 5.5 l11 -12" stroke="#2f9e44" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="524" y="230" font-size="15" font-weight="600" fill="#212529">Servizo operativo</text>
  <text x="524" y="250" font-size="11" fill="#868e96">Todos os compoñentes responden ben.</text>

  <rect x="456" y="298" width="328" height="116" rx="8" fill="#212529" opacity="0.05"/>
  <rect x="456" y="296" width="328" height="116" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="480" y="326" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">SERVIZO</text>
  <circle cx="488" cy="362" r="5" fill="#40c057"/>
  <text x="502" y="370" font-size="22" font-weight="600" fill="#212529">Operativo</text>
  <rect x="684" y="316" width="84" height="22" rx="11" fill="#ebfbee"/>
  <text x="726" y="327" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" letter-spacing="0.4" fill="#2b8a3e">EN LIÑA</text>
  <line x1="480" y1="392" x2="760" y2="392" stroke="#f1f3f5"/>
  <text x="480" y="410" font-size="11" fill="#868e96">Sen incidencias nas últimas 24 h.</text>

  <line x1="456" y1="444" x2="540" y2="444" stroke="#dee2e6" stroke-dasharray="4 4"/>
  <text x="620" y="448" text-anchor="middle" font-size="10" fill="#adb5bd">resto da pantalla</text>
  <line x1="700" y1="444" x2="784" y2="444" stroke="#dee2e6" stroke-dasharray="4 4"/>

  <!-- dropdown, anchored to the trigger's right edge, inside the viewport -->
  <g filter="url(#menuShadowNarrow)">
    <rect x="496" y="100" width="288" height="108" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  </g>
  <text x="512" y="126" font-size="13" font-weight="500" fill="#212529">ana.pereira@conxugal.gal</text>
  <text x="512" y="144" font-size="11" fill="#868e96">Administradora</text>
  <line x1="496" y1="160" x2="784" y2="160" stroke="#e9ecef"/>
  <rect x="500" y="166" width="280" height="38" rx="6" fill="#f1f3f5"/>
  <g transform="translate(512,176) scale(0.7)" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/>
    <path d="M9 12h12l-3 -3"/>
    <path d="M18 15l3 -3"/>
  </g>
  <text x="538" y="185" dominant-baseline="central" font-size="14" fill="#212529">Pechar sesión</text>

  <!-- footer note -->
  <g stroke="#adb5bd" stroke-width="1.4" fill="none" stroke-linecap="round">
    <circle cx="26" cy="498" r="6"/>
    <line x1="26" y1="497" x2="26" y2="501"/>
    <circle cx="26" cy="494" r="0.5" fill="#adb5bd" stroke="none"/>
  </g>
  <text x="40" y="502" font-size="12" fill="#868e96">O disparador non herda o punto de corte que oculta o correo e o rol: baixo <tspan font-style="italic">sm</tspan> queda un botón só con iniciais,</text>
  <text x="40" y="520" font-size="12" fill="#868e96">así que pechar sesión segue sendo alcanzable a calquera ancho, e nada desborda horizontalmente.</text>
</svg>
