<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="modalShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="11"/>
    </filter>
  </defs>

  <!-- ===== backdrop: unclassified worklist (context behind the dialog) ===== -->
  <rect width="1280" height="840" fill="#f8f9fa"/>
  <rect x="0" y="0" width="1280" height="60" fill="#ffffff"/>
  <rect x="0" y="60" width="260" height="780" fill="#ffffff"/>
  <line x1="0" y1="60" x2="1280" y2="60" stroke="#dee2e6" stroke-width="1"/>
  <line x1="260" y1="60" x2="260" y2="840" stroke="#dee2e6" stroke-width="1"/>
  <g transform="translate(24,12) scale(0.18)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="#4c6ef5"/>
    <path d="M 132 55 A 56 56 0 1 0 132 145" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    <path d="M 112 100 L 176 100" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round"/>
    <path d="M 156 80 L 178 100 L 156 120" fill="none" stroke="#fa5252" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="72" y="31" font-size="20" font-weight="700" fill="#212529">conxugal</text>
  <text x="72" y="47" font-size="11" fill="#868e96">Contratos públicos da Xunta de Galicia</text>
  <circle cx="1236" cy="30" r="18" fill="#4c6ef5"/>
  <text x="1236" y="30" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#ffffff">AP</text>
  <text x="24" y="192" font-size="11" font-weight="600" letter-spacing="0.6" fill="#868e96">ADMINISTRACIÓN</text>
  <text x="52" y="232" font-size="14" fill="#495057">Panel</text>
  <text x="52" y="264" font-size="14" fill="#495057">Usuarios</text>
  <rect x="12" y="286" width="236" height="42" rx="8" fill="#edf2ff"/>
  <text x="52" y="312" font-size="14" font-weight="600" fill="#3b5bdb">Órganos</text>
  <text x="284" y="112" font-size="26" font-weight="700" fill="#212529">Órganos</text>
  <text x="284" y="138" font-size="14" fill="#868e96">Organiza o catálogo nunha taxonomía e clasifica os órganos de contratación.</text>
  <rect x="284" y="298" width="400" height="518" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="296" y="630" width="372" height="34" rx="8" fill="#edf2ff"/>
  <text x="326" y="652" font-size="14" font-weight="600" fill="#3b5bdb">Sen clasificar</text>
  <rect x="708" y="298" width="548" height="518" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="732" y="364" font-size="22" font-weight="700" fill="#212529">Sen clasificar</text>
  <text x="732" y="490" font-size="14" font-weight="500" fill="#212529">Instituto Galego da Vivenda e Solo</text>

  <!-- ===== dim overlay ===== -->
  <rect width="1280" height="840" fill="#101113" opacity="0.55"/>

  <!-- ===== modal ===== -->
  <rect x="480" y="110" width="480" height="560" rx="10" fill="#000000" opacity="0.45" filter="url(#modalShadow)"/>
  <rect x="480" y="104" width="480" height="560" rx="10" fill="#ffffff"/>

  <!-- header -->
  <text x="504" y="138" font-size="18" font-weight="600" fill="#212529">Asignar a un nodo</text>
  <g stroke="#868e96" stroke-width="1.6" stroke-linecap="round">
    <line x1="927" y1="127" x2="937" y2="137"/><line x1="937" y1="127" x2="927" y2="137"/>
  </g>
  <line x1="480" y1="156" x2="960" y2="156" stroke="#f1f3f5"/>

  <text x="504" y="182" font-size="12" fill="#868e96">Órgano</text>
  <text x="504" y="202" font-size="15" font-weight="600" fill="#212529">Instituto Galego da Vivenda e Solo</text>
  <text x="504" y="220" font-size="12" fill="#adb5bd">Actualmente: Sen clasificar</text>

  <!-- search field -->
  <text x="504" y="252" font-size="13" font-weight="600" fill="#212529">Nodo<tspan fill="#fa5252"> *</tspan></text>
  <rect x="504" y="262" width="432" height="40" rx="8" fill="#ffffff" stroke="#4c6ef5" stroke-width="1.5"/>
  <g stroke="#adb5bd" stroke-width="1.6" fill="none">
    <circle cx="524" cy="282" r="6"/>
    <line x1="528.5" y1="286.5" x2="532" y2="290" stroke-linecap="round"/>
  </g>
  <text x="542" y="287" font-size="14" fill="#adb5bd">Buscar nodo…</text>

  <!-- open tree listbox -->
  <rect x="504" y="306" width="432" height="288" rx="8" fill="#ffffff" stroke="#dee2e6"/>

  <text x="522" y="330" font-size="13" font-weight="500" fill="#495057">Consellerías</text>

  <rect x="512" y="344" width="416" height="32" rx="6" fill="#edf2ff"/>
  <text x="542" y="364" font-size="13" font-weight="600" fill="#3b5bdb">Consellería de Sanidade</text>
  <g stroke="#3b5bdb" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M902 360 l4 4 l8 -9"/>
  </g>

  <text x="542" y="400" font-size="13" fill="#495057">Consellería de Educación, Ciencia,</text>
  <text x="542" y="416" font-size="13" fill="#495057">Universidades e FP</text>
  <text x="562" y="444" font-size="13" fill="#495057">Axencia Galega de Innovación</text>

  <text x="522" y="474" font-size="13" font-weight="500" fill="#495057">Concellos</text>
  <text x="522" y="500" font-size="13" font-weight="500" fill="#495057">Deputacións provinciais</text>

  <text x="522" y="530" font-size="12" fill="#adb5bd">… 84 nodos máis</text>

  <!-- footer -->
  <line x1="480" y1="608" x2="960" y2="608" stroke="#f1f3f5"/>
  <rect x="716" y="624" width="96" height="40" rx="8" fill="#ffffff" stroke="#ced4da"/>
  <text x="764" y="645" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#495057">Cancelar</text>
  <rect x="820" y="624" width="116" height="40" rx="8" fill="#4c6ef5"/>
  <text x="878" y="645" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#ffffff">Asignar</text>
</svg>
