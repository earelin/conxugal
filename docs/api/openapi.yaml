openapi: 3.1.0

info:
  title: Conxugal REST API
  version: 0.1.0
  description: >-
    REST API for the Conxugal application. All endpoints live under the reserved `/api/`
    prefix (ADR-0006). Authentication is a server-side session established by the
    server-rendered `/login` form (ADR-0005, outside this JSON API) and carried by a
    session cookie. Most operations are restricted to administrators (SPEC-0003 R1); the
    one exception is `GET /api/me`, available to any authenticated user (SPEC-0002 R14).

    This document is the design-first, authoritative contract for the API (ADR-0010):
    endpoints are specified here before they are implemented, and controllers conform to
    it. It currently covers the planned endpoints of FEAT-0004 (user administration,
    system status, and the current-user lookup), FEAT-0005 (real-time metrics), and
    FEAT-0006 (the Órganos de Contratación catalogue import trigger).

servers:
  - url: /
    description: Same origin as the served SPA (ADR-0003).

tags:
  - name: users
    description: User-account administration (SPEC-0003 R6-R16).
  - name: system
    description: System dashboard status and detailed runtime metrics (SPEC-0003 R2-R5, R17-R21).
  - name: account
    description: The authenticated caller's own account (SPEC-0002 R14).
  - name: organos
    description: Órganos de Contratación catalogue import (SPEC-0004 R1, R10, R12).

security:
  - cookieSession: []

paths:
  /api/admin/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List all user accounts
      description: Every account, enabled and disabled, with its email, role, state and creation date (SPEC-0003 R6).
      responses:
        "200":
          description: The full list of accounts.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user account
      description: >-
        Create an account from an email and a role. The server generates the initial
        password and returns it **once** in this response (SPEC-0003 R7, R13); it is never
        retrievable afterwards (SPEC-0003 R16).
      requestBody:
        required: true
        description: The email and role for the new account.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The account was created; the generated initial password is included exactly once.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: An account with that email already exists; the existing account is unchanged (SPEC-0003 R8).
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/users/{id}/enabled:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: setUserEnabled
      summary: Enable or disable a user account
      description: >-
        Set an account's enabled state (SPEC-0003 R9, R10). Disabling the last enabled
        administrator is refused (SPEC-0003 R12). Accounts are never deleted (SPEC-0003 R11).
      requestBody:
        required: true
        description: The account's desired enabled state.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEnabledRequest"
      responses:
        "200":
          description: The account's new state.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The change is refused because it would disable the last enabled administrator (SPEC-0003 R12).
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/system-status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Current system status
      description: >-
        A coarse operational snapshot assembled fresh per request (SPEC-0003 R4): overall
        service state, datastore reachability, and coarse application/runtime info (build
        version, environment, Java runtime, uptime, memory, OS). Never discloses secrets or
        credentials (SPEC-0003 R5).
      responses:
        "200":
          description: The current system status.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/metrics:
    get:
      tags: [system]
      operationId: streamMetrics
      summary: Stream detailed runtime metrics (Server-Sent Events)
      description: >-
        A Server-Sent Events stream (`text/event-stream`, ADR-0009) that pushes successive
        detailed runtime-metrics samples for debugging a running instance (SPEC-0003
        R17-R18), interleaved with heartbeats. Each SSE event's `data` field is a JSON
        object matching the `RuntimeMetrics` schema. Samples are assembled on demand and are
        never stored by the backend (SPEC-0003 R20) and never contain secrets (SPEC-0003 R21).
      responses:
        "200":
          description: >-
            An open event stream. Each `message` event carries one `RuntimeMetrics` sample
            as JSON in its `data` field; heartbeat comments keep the connection alive.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RuntimeMetrics"
              # OpenAPI cannot model an SSE frame sequence; this schema documents the JSON
              # `data` payload carried by each sample event, not a single response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/organos/import:
    post:
      tags: [organos]
      operationId: importOrganos
      summary: Trigger an Órganos de Contratación catalogue import
      description: >-
        Runs an import against the source catalogue and reconciles it into the stored
        catalogue: new Órganos are added, existing ones are refreshed in place, and
        Órganos absent from the source are marked inactive (SPEC-0004 R1, R5, R6, R10).
        If an import is already running (triggered manually or by the schedule), this
        returns the "already running" outcome rather than starting a second concurrent
        run on that instance (SPEC-0004 R12; the guard is per-instance today — running
        more than one instance of the service is not yet supported). If the source is
        unreachable or returns an unusable response, nothing is written and this is
        reported as a 500 (SPEC-0004 R13).
      responses:
        "200":
          description: >-
            The import completed (`SUCCESS`), or another run was already in progress
            (`ALREADY_RUNNING`, SPEC-0004 R12).
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportOutcome"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: >-
            The import could not read the source and wrote nothing: the source was
            unreachable or returned an unusable response (SPEC-0004 R13).
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/me:
    get:
      tags: [account]
      operationId: getCurrentUser
      summary: The current authenticated user
      description: >-
        The caller's own account: identity, role, creation date, and last login
        (SPEC-0002 R14). Available to any authenticated user — `USER` or `ADMIN` — unlike
        the `/api/admin/*` endpoints, which are `ADMIN`-only. Never includes the enabled
        state (a live session already implies it) or the password.
      responses:
        "200":
          description: The caller's own account.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: >-
        Server-side session cookie established by the server-rendered login form (ADR-0005).
        The browser sends it automatically, including on the `EventSource` metrics stream.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: The account's UUID identity.
      schema:
        type: string
        format: uuid

  headers:
    RateLimitLimit:
      description: The number of requests allowed in the current rate-limit window.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100000
    RateLimitRemaining:
      description: The number of requests remaining in the current rate-limit window.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100000
    RateLimitReset:
      description: Seconds until the current rate-limit window resets.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 86400

  responses:
    BadRequest:
      description: The request body is malformed or fails validation.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid session; the caller is not authenticated (SPEC-0002 R7). Protected API routes return 401 rather than an HTML redirect.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller is authenticated but is not an administrator (SPEC-0003 R1).
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No account with the given id exists.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: The caller has exceeded the allowed request rate.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
        Retry-After:
          description: Seconds to wait before retrying the request.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 86400
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: An unexpected error occurred; the failure is not disclosed beyond a generic message.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Role:
      type: string
      enum: [USER, ADMIN]
      example: "ADMIN"
      description: An account's role. ADMIN is a strict superset of USER (SPEC-0002).

    User:
      type: object
      description: A user account and its current administration state (SPEC-0003 R6).
      required: [id, email, role, enabled, createdAt]
      example:
        id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email: "admin@conxugal.gal"
        role: "ADMIN"
        enabled: true
        createdAt: "2026-01-15T09:30:00Z"
        lastLoginAt: "2026-07-10T08:12:00Z"
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email:
          type: string
          format: email
          example: "admin@conxugal.gal"
        role:
          $ref: "#/components/schemas/Role"
        enabled:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T09:30:00Z"
          description: When the account was created.
        lastLoginAt:
          type: [string, "null"]
          format: date-time
          example: "2026-07-10T08:12:00Z"
          description: >-
            The account's most recent successful login, recorded per SPEC-0002 R13.
            Null until the account's first successful login.

    CurrentUser:
      type: object
      description: The authenticated caller's own account (SPEC-0002 R14).
      required: [id, email, role, createdAt]
      example:
        id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email: "user@conxugal.gal"
        role: "USER"
        createdAt: "2026-01-15T09:30:00Z"
        lastLoginAt: "2026-07-10T08:12:00Z"
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email:
          type: string
          format: email
          example: "user@conxugal.gal"
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T09:30:00Z"
          description: When the account was created.
        lastLoginAt:
          type: [string, "null"]
          format: date-time
          example: "2026-07-10T08:12:00Z"
          description: >-
            The account's most recent successful login, recorded per SPEC-0002 R13.
            Null until the account's first successful login.

    CreateUserRequest:
      type: object
      required: [email, role]
      example:
        email: "new.admin@conxugal.gal"
        role: "ADMIN"
      properties:
        email:
          type: string
          format: email
          example: "new.admin@conxugal.gal"
        role:
          $ref: "#/components/schemas/Role"
      description: The password is not accepted here; the server generates it (SPEC-0003 R7).

    CreatedUser:
      type: object
      description: >-
        The account just created, including its one-time system-generated initial
        password (SPEC-0003 R7, R13).
      required: [id, email, role, enabled, createdAt, initialPassword]
      example:
        id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email: "new.admin@conxugal.gal"
        role: "ADMIN"
        enabled: true
        createdAt: "2026-07-18T09:30:00Z"
        initialPassword: "Tg7#kLp2Qw9$mZxR"
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email:
          type: string
          format: email
          example: "new.admin@conxugal.gal"
        role:
          $ref: "#/components/schemas/Role"
        enabled:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-07-18T09:30:00Z"
        initialPassword:
          type: string
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).{16,}$"
          example: "Tg7#kLp2Qw9$mZxR"
          description: >-
            The system-generated initial password, returned only in this creation response
            and never again (SPEC-0003 R13, R16). At least 16 characters spanning upper- and
            lower-case letters, digits and symbols (SPEC-0003 R15).

    SetEnabledRequest:
      type: object
      description: The desired enabled state for an account (SPEC-0003 R9, R10).
      required: [enabled]
      example:
        enabled: false
      properties:
        enabled:
          type: boolean
          example: false
          description: true to enable the account, false to disable it.

    SystemStatus:
      type: object
      description: A point-in-time snapshot of overall service health (SPEC-0003 R2-R5).
      required: [status, datastore, checkedAt, application, runtime]
      example:
        status: "UP"
        datastore:
          reachable: true
        checkedAt: "2026-07-18T09:30:00Z"
        application:
          version: "0.1.0-SNAPSHOT"
          environment: "production"
        runtime:
          javaVersion: "21.0.3"
          javaVendor: "Eclipse Adoptium"
          uptimeMillis: 266320000
          memoryUsedBytes: 536870912
          memoryMaxBytes: 1073741824
          osName: "Linux"
          osArch: "amd64"
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
          example: "UP"
          description: Overall service state (SPEC-0003 R3).
        datastore:
          type: object
          required: [reachable]
          example:
            reachable: true
          properties:
            reachable:
              type: boolean
              example: true
              description: Whether the datastore is reachable (SPEC-0003 R3).
        checkedAt:
          type: string
          format: date-time
          example: "2026-07-18T09:30:00Z"
          description: When this snapshot was taken; it reflects the state at request time (SPEC-0003 R4).
        application:
          type: object
          description: Coarse build/deployment identity (SPEC-0003 R2).
          required: [version, environment]
          example:
            version: "0.1.0-SNAPSHOT"
            environment: "production"
          properties:
            version:
              type: string
              maxLength: 64
              pattern: "^[\x20-\x7E]{1,64}$"
              example: "0.1.0-SNAPSHOT"
              description: The running build's version.
            environment:
              type: string
              maxLength: 64
              pattern: "^[\x20-\x7E]{1,64}$"
              example: "production"
              description: The active environment name(s), or "production" when none is set.
        runtime:
          type: object
          description: >-
            Coarse JVM/OS figures for the running instance (SPEC-0003 R2). Never carries a
            connection string, credential, host or key (SPEC-0003 R5).
          required:
            [javaVersion, javaVendor, uptimeMillis, memoryUsedBytes, memoryMaxBytes, osName, osArch]
          example:
            javaVersion: "21.0.3"
            javaVendor: "Eclipse Adoptium"
            uptimeMillis: 266320000
            memoryUsedBytes: 536870912
            memoryMaxBytes: 1073741824
            osName: "Linux"
            osArch: "amd64"
          properties:
            javaVersion:
              type: string
              maxLength: 64
              pattern: "^[\x20-\x7E]{1,64}$"
              example: "21.0.3"
            javaVendor:
              type: string
              maxLength: 64
              pattern: "^[\x20-\x7E]{1,64}$"
              example: "Eclipse Adoptium"
            uptimeMillis:
              type: integer
              format: int64
              minimum: 0
              maximum: 315360000000
              example: 266320000
              description: Milliseconds since the JVM started.
            memoryUsedBytes:
              type: integer
              format: int64
              minimum: 0
              maximum: 549755813888
              example: 536870912
            memoryMaxBytes:
              type: integer
              format: int64
              minimum: 0
              maximum: 549755813888
              example: 1073741824
            osName:
              type: string
              maxLength: 64
              pattern: "^[\x20-\x7E]{1,64}$"
              example: "Linux"
            osArch:
              type: string
              maxLength: 64
              pattern: "^[\x20-\x7E]{1,64}$"
              example: "amd64"

    ImportOutcome:
      type: object
      description: >-
        The result of an import run that did not fail (SPEC-0004 R10, R12) — a source
        failure is reported as a 500 instead (SPEC-0004 R13), never as this body. `added`,
        `refreshed` and `deactivated` are always 0 unless `status` is `SUCCESS`.
      required: [status, added, refreshed, deactivated]
      example:
        status: "SUCCESS"
        added: 3
        refreshed: 12
        deactivated: 1
      properties:
        status:
          type: string
          enum: [SUCCESS, ALREADY_RUNNING]
          example: "SUCCESS"
          description: >-
            SUCCESS if the import completed; ALREADY_RUNNING if another import was
            already in progress (SPEC-0004 R12).
        added:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          example: 3
          description: Órganos new to the source, stored as active (SPEC-0004 R5).
        refreshed:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          example: 12
          description: Órganos already stored, matched by identity and updated in place (SPEC-0004 R5).
        deactivated:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          example: 1
          description: Previously-stored Órganos absent from this import, marked inactive (SPEC-0004 R6).

    RuntimeMetrics:
      type: object
      description: >-
        One detailed runtime sample. The exact field set is illustrative and never includes
