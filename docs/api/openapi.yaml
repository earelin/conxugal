openapi: 3.1.0

info:
  title: Conxugal REST API
  version: 0.1.0
  description: >-
    REST API for the Conxugal application. All endpoints live under the reserved `/api/` prefix
    (ADR-0006). Authentication is a server-side session established by the server-rendered
    `/login` form (ADR-0005, outside this JSON API) and carried by a session cookie. Most
    operations are restricted to administrators; the exceptions are `GET /api/me` and the two
    Órganos reads (`GET /api/organos` and `GET /api/organos/taxonomia`), available to any
    authenticated user. `GET /api/organos` serves the **visible set** — the Órganos holding at
    least one visible contract — to every caller alike; the **whole** catalogue is an
    administration read, `GET /api/admin/organos`.

    This document is the design-first, authoritative contract for the API (ADR-0010): endpoints
    are specified here before they are implemented, and controllers conform to it. It currently
    covers the planned endpoints of FEAT-0004 (user administration, system status, and the
    current-user lookup), FEAT-0005 (real-time metrics), FEAT-0006 (the Órganos de Contratación
    catalogue import trigger), FEAT-0007 (the Órganos catalogue and taxonomía reads, and the
    administration of the taxonomía and of each Órgano's placement in it), FEAT-0009 (the
    contratos menores import mark and the administrator's catalogue read that carries it, the
    two import triggers, and the read that reports what a run amounted to), and FEAT-0012 (the
    narrowing of the shared catalogue read to the visible set).

servers:
  - url: /
    description: Same origin as the served SPA (ADR-0003).

tags:
  - name: users
    description: User-account administration.
  - name: system
    description: System dashboard status and detailed runtime metrics.
  - name: account
    description: The authenticated caller's own account.
  - name: organos
    description: >-
      The Órganos de Contratación catalogue, the taxonomía of terms it is classified into, and the
      catalogue import.
  - name: imports
    description: >-
      Triggering a contratos menores import, and reading what one run amounted to.

security:
  - cookieSession: []

paths:
  /api/admin/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List all user accounts
      description: Every account, enabled and disabled, with its email, role, state and creation date.
      responses:
        "200":
          description: The full list of accounts.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user account
      description: >-
        Create an account from an email and a role. The server generates the initial password and
        returns it **once** in this response; it is never retrievable afterwards.
      requestBody:
        required: true
        description: The email and role for the new account.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The account was created; the generated initial password is included exactly once.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: An account with that email already exists; the existing account is unchanged.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/users/{id}/enabled:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: setUserEnabled
      summary: Enable or disable a user account
      description: >-
        Set an account's enabled state. Disabling the last enabled administrator is refused.
        Accounts are never deleted.
      requestBody:
        required: true
        description: The account's desired enabled state.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEnabledRequest"
      responses:
        "200":
          description: The account's new state.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The change is refused because it would disable the last enabled administrator.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/system-status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Current system status
      description: >-
        A coarse operational snapshot assembled fresh per request: overall service state,
        datastore reachability, and coarse application/runtime info (build version, environment,
        Java runtime, uptime, memory, OS). Never discloses secrets or credentials.
      responses:
        "200":
          description: The current system status.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/metrics:
    get:
      tags: [system]
      operationId: streamMetrics
      summary: Stream detailed runtime metrics (Server-Sent Events)
      description: >-
        A Server-Sent Events stream (`text/event-stream`, ADR-0009) that pushes successive
        detailed runtime-metrics samples for debugging a running instance, interleaved with
        heartbeats. Each SSE event's `data` field is a JSON object matching the `RuntimeMetrics`
        schema. Samples are assembled on demand and are never stored by the backend and never
        contain secrets.
      responses:
        "200":
          description: >-
            An open event stream. Each `message` event carries one `RuntimeMetrics` sample as JSON
            in its `data` field; heartbeat comments keep the connection alive.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RuntimeMetrics"
              # OpenAPI cannot model an SSE frame sequence; this schema documents the JSON
              # `data` payload carried by each sample event, not a single response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/organos:
    get:
      tags: [organos]
      operationId: listOrganosForAdmin
      summary: List the catalogue as an administrator sees it
      description: >-
        **Every stored Órgano** — the whole catalogue, whether or not it holds a visible contract
        — each carrying its id, name, active state and taxonomía placement **plus its contratos
        menores import mark and import state**. This is the read the administration area makes:
        `GET /api/organos` is narrowed to the visible set, and the Órganos it leaves out are
        precisely the ones an administrator opens the section to classify and mark. A second
        serialisation of an Órgano exists because the mark and the state are an administrator's
        facts: seeing which Órganos are marked, and how far each one has loaded, is an
        administration capability, so neither can be added to the read any authenticated user may
        make. It carries the placement alongside them so the administration UI swaps one read for
        the other rather than issuing both.
      responses:
        "200":
          description: >-
            The whole catalogue — active and inactive, classified and unclassified alike — in the
            same name order under a Galician collation `GET /api/organos` guarantees. Empty only
            when nothing has been imported yet.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrgano"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/organos/import:
    post:
      tags: [organos]
      operationId: importOrganos
      summary: Trigger an Órganos de Contratación catalogue import
      description: >-
        Runs an import against the source catalogue and reconciles it into the stored catalogue:
        new Órganos are added, existing ones are refreshed in place, and Órganos absent from the
        source are marked inactive. If an import is already running (triggered manually or by the
        schedule), this returns the "already running" outcome rather than starting a second
        concurrent run on that instance (the guard is per-instance today — running more than one
        instance of the service is not yet supported). If the source is unreachable or returns an
        unusable response, nothing is written and this is reported as a 500 carrying the problem
        type `urn:conxugal:problem-type:organo-import-failed` — never as a `SUCCESS` outcome with
        zero counts, which a client could not tell from an import that found nothing to do.
      responses:
        "200":
          description: >-
            The import completed (`SUCCESS`), or another run was already in progress
            (`ALREADY_RUNNING`).
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportOutcome"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: >-
            The source was unreachable or returned an unusable response; nothing was written and
            the stored catalogue, its states and the taxonomía are unchanged. Carries the problem
            type `urn:conxugal:problem-type:organo-import-failed`, which is what lets an
            administrator be told the source failed rather than that the server did.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/organos/taxonomia/termos:
    post:
      tags: [organos]
      operationId: createTermo
      summary: Create a taxonomía term
      description: >-
        Add a term to the taxonomía, at the root when `parentId` is null and under an existing
        term otherwise. The name is stored stripped of surrounding whitespace and must not
        collide, case-insensitively, with a name already used by one of the siblings the new term
        joins — roots being siblings of each other.
      requestBody:
        required: true
        description: The name for the new term, and the term it sits under.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTermoRequest"
      responses:
        "201":
          description: >-
            The term was created. The body carries its system-assigned `id`, so a client can
            select and expand the new term without re-reading `GET /api/organos/taxonomia`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Termo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            The named parent term does not exist; nothing is created. Carries the problem type
            `urn:conxugal:problem-type:termo-not-found`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            A sibling already carries that name, case-insensitively; nothing is created. Carries
            the problem type `urn:conxugal:problem-type:duplicate-sibling-name`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/organos/taxonomia/termo/{id}:
    parameters:
      - $ref: "#/components/parameters/TermoId"
    patch:
      tags: [organos]
      operationId: renameTermo
      summary: Rename a taxonomía term
      description: >-
        Change a term's name, leaving its place in the tree untouched. The new name is stored
        stripped and is subject to the same sibling-name rule as a create.
      requestBody:
        required: true
        description: The term's new name.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameTermoRequest"
      responses:
        "200":
          description: The term's new state.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Termo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No term exists with that id; nothing is renamed. Carries the problem type
            `urn:conxugal:problem-type:termo-not-found`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            A sibling already carries that name, case-insensitively; nothing is renamed. Carries
            the problem type `urn:conxugal:problem-type:duplicate-sibling-name`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [organos]
      operationId: deleteTermo
      summary: Delete a taxonomía term
      description: >-
        Remove a term from the taxonomía. Refused while the term still has child terms — the
        administrator moves or removes them first. The Órganos filed directly in a deleted term
        return to the unclassified set, arriving in `GET /api/admin/organos` with a null
        `termoId`; no Órgano is ever deleted.
      responses:
        "204":
          description: The term was deleted, and any Órganos filed in it are now unclassified.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No term exists with that id; nothing is deleted. Carries the problem type
            `urn:conxugal:problem-type:termo-not-found`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The term still has child terms; the term and its children are unchanged. Carries the
            problem type `urn:conxugal:problem-type:termo-has-children` — distinct from the cycle
            refusal of `PUT .../parent`, which is also a 409.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/organos/taxonomia/termo/{id}/parent:
    parameters:
      - $ref: "#/components/parameters/TermoId"
    put:
      tags: [organos]
      operationId: moveTermo
      summary: Move a taxonomía term to a new parent
      description: >-
        Re-parent a term, or move it out to the root with an explicit null `parentId`. Refused
        when the target is the term itself or one of its own descendants, which would detach that
        branch into a cycle, and when the term would land beside a sibling of the same name. A
        refused move writes nothing.
      requestBody:
        required: true
        description: The term to move under, or null to move it to the root.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveTermoRequest"
      responses:
        "204":
          description: The term was moved.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            Either the term being moved or the target parent does not exist; nothing is moved.
            Carries the problem type `urn:conxugal:problem-type:termo-not-found`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The move is refused and the taxonomía is unchanged. Carries one of two problem types,
            which a client must tell apart to explain the refusal:
            `urn:conxugal:problem-type:termo-cycle` when the target is the term itself or one of
            its descendants, and `urn:conxugal:problem-type:duplicate-sibling-name` when a sibling
            under the target already carries that name.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/organo/{id}/termo:
    parameters:
      - $ref: "#/components/parameters/OrganoId"
    put:
      tags: [organos]
      operationId: assignOrganoTermo
      summary: File an Órgano under a taxonomía term
      description: >-
        Place an Órgano in a term, **replacing** whatever term it was in — a placement is
        singular, never additive, so an Órgano is never in two terms at once. This changes the
        Órgano rather than the taxonomía, which is why it hangs off the Órgano's own path rather
        than a taxonomía one.
      requestBody:
        required: true
        description: The term to file the Órgano under.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTermoRequest"
      responses:
        "204":
          description: >-
            The Órgano is now filed under that term, and under no other. The new placement is
            visible in the next `GET /api/admin/organos` as the Órgano's `termoId` — the read the
            administration area makes, and the one that carries an Órgano holding no visible
            contract, which `GET /api/organos` does not return at all.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            Nothing is written. Carries one of two problem types, so a client can say which of the
            two ids was wrong: `urn:conxugal:problem-type:organo-not-found` when no Órgano exists
            with that id, and `urn:conxugal:problem-type:termo-not-found` when the named term does
            not exist.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [organos]
      operationId: clearOrganoTermo
      summary: Return an Órgano to the unclassified set
      description: >-
        Remove an Órgano's placement, so it is filed under no term. Idempotent: clearing an Órgano
        that is already unclassified succeeds and writes nothing. There is no unclassified
        collection to move it into — an Órgano whose `termoId` is null *is* unclassified.
      responses:
        "204":
          description: >-
            The Órgano is filed under no term. Its `termoId` is null in the next `GET
            /api/admin/organos`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No Órgano exists with that id; nothing is written. Carries the problem type
            `urn:conxugal:problem-type:organo-not-found`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/organo/{id}/importable:
    parameters:
      - $ref: "#/components/parameters/OrganoId"
    put:
      tags: [organos]
      operationId: markOrganoImportable
      summary: Mark an Órgano for contratos menores import
      description: >-
        Opt an Órgano into having its contratos menores imported, and ask for that import.
        Marking an already-marked Órgano succeeds and leaves the mark as it is, but it is not
        without effect: the import is asked for every time, which is what lets an administrator
        whose mark was refused ask again without unmarking first. Marking and unmarking are two
        methods rather than one flag with a body because they are two operations with different
        rules — an Órgano is never imported unless it was deliberately opted in, and clearing
        the mark stops a load rather than reversing a field.


        The import covers **this Órgano alone**, never every marked one, and it is asked for
        after the mark is written. **A refusal is answered `200`, not `409`**, and this is the
        one place the mark and the triggers disagree: the mark applies whether or not an import
        starts, so a `409` would tell the client the write did not happen when it did. The body
        says which of the two occurred — `runId` when a run started, `refusal` when none did —
        and the Órgano reads as marked either way.
      responses:
        "200":
          description: >-
            The Órgano is marked, visible in the next `GET /api/admin/organos` as the Órgano's
            `importable`. The body says whether marking also started an import.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkOutcome"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No Órgano exists with that id; nothing is written. Carries the problem type
            `urn:conxugal:problem-type:organo-not-found`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [organos]
      operationId: unmarkOrganoImportable
      summary: Stop importing an Órgano's contratos menores
      description: >-
        Opt an Órgano back out. Idempotent: unmarking an Órgano that is not marked succeeds and
        writes nothing. Contratos menores already stored for the Órgano are **kept** — unmarking
        stops it being updated, it does not discard what was loaded.
      responses:
        "204":
          description: >-
            The Órgano is not marked. Its `importable` is false in the next `GET
            /api/admin/organos`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No Órgano exists with that id; nothing is written. Carries the problem type
            `urn:conxugal:problem-type:organo-not-found`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/contratos-menores/import:
    post:
      tags: [imports]
      operationId: startContratosMenoresImport
      summary: Import the contratos menores of every marked Órgano
      description: >-
        Start an import covering every Órgano that is active in the catalogue and marked
        importable. Eligibility is evaluated here rather than by the caller, so this trigger, the
        single-Órgano trigger and the mark cannot disagree about which Órganos are in scope.


        **This answers before the import runs.** An initial import walks years of history for
        every covered Órgano and takes days, so no trigger can carry its outcome: this returns
        the identifier of the run doing the work and a `Location` pointing at the read that
        reports it. Nothing about the outcome — not even whether the first Órgano succeeded — is
        known by the time this responds.


        At most one import runs at a time across the whole system, this one and the catalogue
        import alike, so a trigger arriving while another holds that guard starts nothing and is
        refused rather than queued.
      responses:
        "202":
          description: >-
            A run was claimed and the import is under way. `GET /api/admin/import-run/{id}` on
            the returned identifier reports its progress and, in time, its verdict.
          headers:
            Location:
              $ref: "#/components/headers/ImportRunLocation"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRunStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            Another import already holds the system-wide guard; no run was claimed and nothing
            was written. Carries the problem type
            `urn:conxugal:problem-type:import-already-running`. This is a matter of timing —
            asking again once the running import finishes works.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/organo/{id}/contratos-menores/import:
    parameters:
      - $ref: "#/components/parameters/OrganoId"
    post:
      tags: [imports]
      operationId: startOrganoContratosMenoresImport
      summary: Import one Órgano's contratos menores
      description: >-
        Start an import covering the named Órgano alone. Asynchronous on the same terms as the
        sweep above: it answers with the run's identifier and a `Location` pointing at the run
        read, never with the outcome.


        **The two refusals are different problems and carry different types.** A `409` with
        `urn:conxugal:problem-type:import-already-running` says another import holds the guard,
        which asking again later resolves. A `409` with
        `urn:conxugal:problem-type:organo-not-eligible` says this Órgano is inactive in the
        catalogue, unmarked, or both — a refusal that repeats until the catalogue or the mark
        changes. An administrator told only that an import is running would wait for one that is
        never going to start.
      responses:
        "202":
          description: >-
            A run was claimed for this Órgano and the import is under way. `GET
            /api/admin/import-run/{id}` on the returned identifier reports it.
          headers:
            Location:
              $ref: "#/components/headers/ImportRunLocation"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRunStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No Órgano exists with that id; nothing was started. Carries the problem type
            `urn:conxugal:problem-type:organo-not-found` — distinct from the Órgano existing but
            not being eligible, which is a `409`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Nothing was started, for one of two reasons the body tells apart:
            `urn:conxugal:problem-type:import-already-running` when another import holds the
            guard, and `urn:conxugal:problem-type:organo-not-eligible` when the Órgano is not
            active and marked. A client that can only read the status cannot tell *wait* from
            *mark the Órgano*.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/import-run/{id}:
    parameters:
      - $ref: "#/components/parameters/ImportRunId"
    get:
      tags: [imports]
      operationId: readImportRun
      summary: Read what one import run amounted to
      description: >-
        The run's verdict, when it ran, what it counted, and every Órgano it set out to cover
        with that Órgano's own state and counts. This is where a trigger's outcome is read: the
        triggers answer before the work starts, and this answers for it.


        The covered Órganos are those the run enumerated when it was claimed rather than those it
        reached, so a run that died partway still names what it was going to cover and which of
        them failed. They are ordered by identity; the order a run takes them in is not recorded.
      responses:
        "200":
          description: The run, its verdict, and every Órgano it covers.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No run exists with that id. Carries the problem type
            `urn:conxugal:problem-type:import-run-not-found`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/organos:
    get:
      tags: [organos]
      operationId: listOrganos
      summary: List the Órganos that hold at least one visible contract
      description: >-
        The **visible set**: every stored Órgano — active and inactive alike — holding at least one
        visible contract, of **any** contract family, with its name and the term it is filed under,
        or null when it is unclassified. An Órgano holding none is **not returned at all**, rather
        than returned for a client to hide. Available to any authenticated user, `USER` or `ADMIN`,
        and the narrowing applies to **every** caller: it is this path's scoping, not the caller's,
        so an `ADMIN` reading here receives exactly what a `USER` does. **The whole catalogue is
        served by `GET /api/admin/organos`**, which is where an administrator's management surfaces
        read it from. Unfiltered and unpaged, and it takes no query parameters. Callers join this
        list to `GET /api/organos/taxonomia` on `termoId` = term `id` to build the tree, and filter
        `termoId` = null for the unclassified set.
      responses:
        "200":
          description: >-
            The visible set, **ordered by name** under a Galician collation, so accented names
            sort where a Galician reader expects them (`Ávila` before `Avión`, not after
            `Zamora`). The order is a guarantee callers may rely on and need not re-derive.
            Membership is derived on every read and nothing records it: an Órgano appears as soon
            as its first visible contract is stored and stops appearing when its last one goes,
            with no administrator action either way. Empty when nothing visible has been imported
            yet.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/organos/taxonomia:
    get:
      tags: [organos]
      operationId: listTermos
      summary: List every term of the Órganos taxonomía
      description: >-
        Every term of the taxonomía the catalogue is classified into, each naming its parent or
        null when it is a root. A **flat list**, not a tree: no term carries its children or the
        Órganos filed under it, and the caller assembles the tree from the parent edges. Available
        to any authenticated user, `USER` or `ADMIN`. Unfiltered and unpaged, and it takes no
        query parameters.
      responses:
        "200":
          description: >-
            Every term, **ordered by name** under a Galician collation, so accented names sort
            where a Galician reader expects them (`Ávila` before `Avión`, not after `Zamora`). The
            order is a guarantee callers may rely on and need not re-derive; because grouping
            preserves relative order, siblings stay in name order once a caller groups by
            `parentId`. Empty until the first term is created — the normal state after a first
            import.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Termo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/organo/{id}:
    parameters:
      - $ref: "#/components/parameters/OrganoId"
    get:
      tags: [organos]
      operationId: getOrgano
      summary: Read one Órgano and the contract families it holds data for
      description: >-
        One Órgano's own attributes, and **one summary per contract family it holds visible data
        for**. This is the single read an Órgano's page is built from: its name, the tabs it draws,
        and the opening section's year chooser all come from this response. Available to any
        authenticated user, `USER` or `ADMIN`.


        **A family present in `families` has visible data; one absent has none.** Presence is not
        a separate flag that could disagree with the summary beside it — it *is* the summary's
        existence. `families: {}` is an Órgano holding nothing, and it draws no tab bar.


        **The keys are family slugs**, spelled exactly as the client's child-route segments, so a
        response maps onto a route with no lookup table in between. Each family's summary is owned
        by that family: this operation composes them and restates none of them.


        **It carries no contract.** No list, no row, no paging envelope and no year parameter — it
        takes no query parameter at all. An Órgano a caller cannot reach through `GET /api/organos`
        is **not** an error here: visibility is a property of the contracts, not of the reader, so
        such an Órgano answers `200` with an empty `families`. Only an unknown id is a `404`.
      responses:
        "200":
          description: >-
            The Órgano, and one summary per contract family it holds visible data for. `families`
            is always present and is `{}` when it holds none.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganoMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            No Órgano exists with that id. Carries the problem type
            `urn:conxugal:problem-type:organo-not-found`, the same type every other operation
            naming an Órgano uses.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/me:
    get:
      tags: [account]
      operationId: getCurrentUser
      summary: The current authenticated user
      description: >-
        The caller's own account: identity, role, creation date, and last login. Available to any
        authenticated user — `USER` or `ADMIN` — unlike the `/api/admin/*` endpoints, which are
        `ADMIN`-only. Never includes the enabled state (a live session already implies it) or the
        password.
      responses:
        "200":
          description: The caller's own account.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: >-
        Server-side session cookie established by the server-rendered login form (ADR-0005). The
        browser sends it automatically, including on the `EventSource` metrics stream.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: The account's UUID identity.
      schema:
        type: string
        format: uuid
    TermoId:
      name: id
      in: path
      required: true
      description: The taxonomía term's UUID identity.
      schema:
        type: string
        format: uuid
    OrganoId:
      name: id
      in: path
      required: true
      description: The Órgano de Contratación's UUID identity.
      schema:
        type: string
        format: uuid
    ImportRunId:
      name: id
      in: path
      required: true
      description: The import run's UUID identity, as a trigger returned it.
      schema:
        type: string
        format: uuid

  headers:
    ImportRunLocation:
      description: The run read for the run just claimed, `/api/admin/import-run/{id}`.
      schema:
        type: string
        format: uri-reference
        maxLength: 200
        pattern: "^/api/admin/import-run/[0-9a-fA-F-]{36}$"
    RateLimitLimit:
      description: The number of requests allowed in the current rate-limit window.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100000
    RateLimitRemaining:
      description: The number of requests remaining in the current rate-limit window.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100000
    RateLimitReset:
      description: Seconds until the current rate-limit window resets.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 86400

  responses:
    BadRequest:
      description: The request body is malformed or fails validation.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid session; the caller is not authenticated. Protected API routes return 401 rather than an HTML redirect.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller is authenticated but is not an administrator.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No account with the given id exists.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: The caller has exceeded the allowed request rate.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
        Retry-After:
          description: Seconds to wait before retrying the request.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 86400
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: An unexpected error occurred; the failure is not disclosed beyond a generic message.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Role:
      type: string
      enum: [USER, ADMIN]
      example: "ADMIN"
      description: An account's role. ADMIN is a strict superset of USER.

    User:
      type: object
      description: A user account and its current administration state.
      required: [id, email, role, enabled, createdAt]
      example:
        id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email: "admin@conxugal.gal"
        role: "ADMIN"
        enabled: true
        createdAt: "2026-01-15T09:30:00Z"
        lastLoginAt: "2026-07-10T08:12:00Z"
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email:
          type: string
          format: email
          example: "admin@conxugal.gal"
        role:
          $ref: "#/components/schemas/Role"
        enabled:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T09:30:00Z"
          description: When the account was created.
        lastLoginAt:
          type: [string, "null"]
          format: date-time
          example: "2026-07-10T08:12:00Z"
          description: >-
            The account's most recent successful login, recorded on each one. Null until the
            account's first successful login.

    CurrentUser:
      type: object
      description: The authenticated caller's own account.
      required: [id, email, role, createdAt]
      example:
        id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email: "user@conxugal.gal"
        role: "USER"
        createdAt: "2026-01-15T09:30:00Z"
        lastLoginAt: "2026-07-10T08:12:00Z"
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email:
          type: string
          format: email
          example: "user@conxugal.gal"
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T09:30:00Z"
          description: When the account was created.
        lastLoginAt:
          type: [string, "null"]
          format: date-time
          example: "2026-07-10T08:12:00Z"
          description: >-
            The account's most recent successful login, recorded on each one. Null until the
            account's first successful login.

    CreateUserRequest:
      type: object
      required: [email, role]
      example:
        email: "new.admin@conxugal.gal"
        role: "ADMIN"
      properties:
        email:
          type: string
          format: email
          example: "new.admin@conxugal.gal"
        role:
          $ref: "#/components/schemas/Role"
      description: The password is not accepted here; the server generates it.

    CreatedUser:
      type: object
      description: >-
        The account just created, including its one-time system-generated initial password.
      required: [id, email, role, enabled, createdAt, initialPassword]
      example:
        id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email: "new.admin@conxugal.gal"
        role: "ADMIN"
        enabled: true
        createdAt: "2026-07-18T09:30:00Z"
        initialPassword: "Tg7#kLp2Qw9$mZxR"
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email:
          type: string
          format: email
          example: "new.admin@conxugal.gal"
        role:
          $ref: "#/components/schemas/Role"
        enabled:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-07-18T09:30:00Z"
        initialPassword:
          type: string
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).{16,}$"
          example: "Tg7#kLp2Qw9$mZxR"
          description: >-
            The system-generated initial password, returned only in this creation response and
            never again. At least 16 characters spanning upper- and lower-case letters, digits and
            symbols.

    SetEnabledRequest:
      type: object
      description: The desired enabled state for an account.
      required: [enabled]
      example:
        enabled: false
      properties:
        enabled:
          type: boolean
          example: false
          description: true to enable the account, false to disable it.

    SystemStatus:
      type: object
      description: A point-in-time snapshot of overall service health.
      required: [status, datastore, checkedAt, application, runtime]
      example:
        status: "UP"
        datastore:
          reachable: true
        checkedAt: "2026-07-18T09:30:00Z"
        application:
          version: "0.1.0-SNAPSHOT"
          environment: "production"
        runtime:
          javaVersion: "21.0.3"
          javaVendor: "Eclipse Adoptium"
          uptimeMillis: 266320000
          memoryUsedBytes: 536870912
          memoryMaxBytes: 1073741824
          osName: "Linux"
          osArch: "amd64"
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
          example: "UP"
          description: Overall service state.
        datastore:
          type: object
          required: [reachable]
          example:
            reachable: true
          properties:
            reachable:
              type: boolean
              example: true
              description: Whether the datastore is reachable.
        checkedAt:
          type: string
          format: date-time
          example: "2026-07-18T09:30:00Z"
          description: When this snapshot was taken; it reflects the state at request time.
        application:
          type: object
          description: Coarse build/deployment identity.
          required: [version, environment]
          example:
            version: "0.1.0-SNAPSHOT"
            environment: "production"
          properties:
            version:
              type: string
              maxLength: 64
              pattern: "^[\x20-\x7E]{1,64}$"
              example: "0.1.0-SNAPSHOT"
              description: The running build's version.
            environment:
              type: string
              maxLength: 64
              pattern: "^[\x20-\x7E]{1,64}$"
              example: "production"
              description: The active environment name(s), or "production" when none is set.
        runtime:
          type: object
          description: >-
            Coarse JVM/OS figures for the running instance. Never carries a connection string,
            credential, host or key.
          required:
            [javaVersion, javaVendor, uptimeMillis, memoryUsedBytes, memoryMaxBytes, osName, osArch]
          example:
            javaVersion: "21.0.3"
            javaVendor: "Eclipse Adoptium"
            uptimeMillis: 266320000
            memoryUsedBytes: 536870912
            memoryMaxBytes: 1073741824
            osName: "Linux"
            osArch: "amd64"
          properties:
            javaVersion:
              type: string
              maxLength: 64
              pattern: "^[\x20-\x7E]{1,64}$"
              example: "21.0.3"
            javaVendor:
              type: string
              maxLength: 64
              pattern: "^[\x20-\x7E]{1,64}$"
              example: "Eclipse Adoptium"
            uptimeMillis:
              type: integer
              format: int64
              minimum: 0
              maximum: 315360000000
              example: 266320000
              description: Milliseconds since the JVM started.
            memoryUsedBytes:
              type: integer
              format: int64
              minimum: 0
              maximum: 549755813888
              example: 536870912
            memoryMaxBytes:
              type: integer
              format: int64
              minimum: 0
              maximum: 549755813888
              example: 1073741824
            osName:
              type: string
              maxLength: 64
              pattern: "^[\x20-\x7E]{1,64}$"
              example: "Linux"
            osArch:
              type: string
              maxLength: 64
              pattern: "^[\x20-\x7E]{1,64}$"
              example: "amd64"

    Organo:
      type: object
      description: >-
        One Órgano de Contratación of the visible set, with its taxonomía placement. `termoId` is
        always present, null when unclassified — the absence of a placement is a value callers
        filter on, not a missing field.
      required: [id, name, active, termoId]
      example:
        id: "8d1b0f6e-2c5a-4c1e-9a3f-6b7c8d9e0f11"
        name: "Consellería de Sanidade"
        active: true
        termoId: "1c9e4d2b-7a3f-4e58-9b21-0d6f5a4c3e77"
      properties:
        id:
          type: string
          format: uuid
          example: "8d1b0f6e-2c5a-4c1e-9a3f-6b7c8d9e0f11"
          description: The Órgano's system-assigned identity, stable across imports.
        name:
          type: string
          maxLength: 255
          pattern: "^\\S(.*\\S)?$"
          example: "Consellería de Sanidade"
        active:
          type: boolean
          example: true
          description: >-
            False once the Órgano stops appearing in the source catalogue; it is never removed.
        termoId:
          type: [string, "null"]
          format: uuid
          example: "1c9e4d2b-7a3f-4e58-9b21-0d6f5a4c3e77"
          description: >-
            The single term this Órgano is filed under, matching a `Termo.id` from `GET
            /api/organos/taxonomia`. Null means unclassified — there is no separate unclassified
            collection, so callers filter for it.

    OrganoMember:
      type: object
      description: >-
        One Órgano as its own page reads it: its identity, its name, and the contract families it
        holds visible data for. A **second serialisation** of the same aggregate rather than an
        extension of `Organo` — the catalogue row carries `active` and `termoId` because a caller
        filters and files by them, and this one carries neither because the page renders neither.
      required: [id, name, families]
      example:
        id: "8d1b0f6e-2c5a-4c1e-9a3f-6b7c8d9e0f11"
        name: "Servizo Galego de Saúde"
        families:
          contratos-menores:
            years: [2025, 2024, 2023]
            partial: false
            updating: true
      properties:
        id:
          type: string
          format: uuid
          example: "8d1b0f6e-2c5a-4c1e-9a3f-6b7c8d9e0f11"
          description: The Órgano's system-assigned identity, stable across imports.
        name:
          type: string
          maxLength: 255
          pattern: "^\\S(.*\\S)?$"
          example: "Servizo Galego de Saúde"
        families:
          $ref: "#/components/schemas/OrganoFamilies"

    OrganoFamilies:
      type: object
      additionalProperties: false
      description: >-
        The contract families this Órgano holds visible data for, keyed by family slug — spelled
        exactly as the client's child-route segment, so no lookup table exists that could disagree
        with the router. **A family is present when it has visible data and absent when it has
        none**, and that absence is the whole mechanism: there is no *has contracts* flag, because
        a flag beside a summary could disagree with it.


        **Always present, and `{}` when the Órgano holds nothing** — an Órgano holding no contracts
        at all is a fact the page renders, and an absent key would be a different fact from an
        empty object. No property is required, and an absent family is omitted rather than sent as
        null.


        A family the system gains later **adds a property here**; it changes nothing already
        declared.
      example:
        contratos-menores:
          years: [2025, 2024, 2023]
          partial: false
          updating: true
      properties:
        contratos-menores:
          $ref: "#/components/schemas/ContratosMenoresSummary"

    AdminOrgano:
      type: object
      description: >-
        One Órgano de Contratación as an administrator sees it: every field `Organo` carries, plus
        the contratos menores import mark and the state of that import. Both are deliberately
        absent from `Organo` — a `USER` is not told which Órganos are imported — so this is a
        second serialisation of the same aggregate rather than an extension of the shared one.
        Which Órganos are serialised this way is the operation's business, not the schema's: the
        administration read carries the whole catalogue, the shared one only the visible set.
        The mark and the state are independent facts: the mark is what an administrator asked
        for, the state is how far the system got.
      required: [id, name, active, termoId, importable, importState]
      example:
        id: "8d1b0f6e-2c5a-4c1e-9a3f-6b7c8d9e0f11"
        name: "Consellería de Sanidade"
        active: true
        termoId: "1c9e4d2b-7a3f-4e58-9b21-0d6f5a4c3e77"
        importable: true
        importState: "INCOMPLETE"
      properties:
        id:
          type: string
          format: uuid
          example: "8d1b0f6e-2c5a-4c1e-9a3f-6b7c8d9e0f11"
          description: The Órgano's system-assigned identity, stable across imports.
        name:
          type: string
          maxLength: 255
          pattern: "^\\S(.*\\S)?$"
          example: "Consellería de Sanidade"
        active:
          type: boolean
          example: true
          description: >-
            False once the Órgano stops appearing in the source catalogue; it is never removed.
        termoId:
          type: [string, "null"]
          format: uuid
          example: "1c9e4d2b-7a3f-4e58-9b21-0d6f5a4c3e77"
          description: >-
            The single term this Órgano is filed under, matching a `Termo.id` from `GET
            /api/organos/taxonomia`. Null means unclassified.
        importable:
          type: boolean
          example: true
          description: >-
            Whether an administrator has opted this Órgano into having its contratos menores
            imported. False for every newly discovered Órgano, and never changed by a catalogue
            import — only by `PUT`/`DELETE /api/admin/organo/{id}/importable`.
        importState:
          type: string
          enum: [NEVER_STARTED, INCOMPLETE, COMPLETE]
          example: "INCOMPLETE"
          description: >-
            How far this Órgano's contratos menores history has been loaded: `NEVER_STARTED`
            before any import has run for it, `INCOMPLETE` once one has started but not reached
            the Órgano's earliest publication, and `COMPLETE` once its full published history is
            stored. Three values rather than two because a half-loaded Órgano and a never-loaded
            one need different treatment, and collapsing them would let a partial load read as up
            to date. Independent of `importable`: an Órgano never imported reports
            `NEVER_STARTED` whether or not it is marked, and unmarking one keeps whatever state
            it had reached, since its stored contracts are retained.

    Termo:
      type: object
      description: >-
        One term of the Órganos taxonomía, carrying only the edge to its parent. It never lists
        its children or the Órganos filed under it: each edge is stated once, from the side that
        stores it. `parentId` is always present, null for a root — the absence of a parent is a
        value callers group on, not a missing field.
      required: [id, name, parentId]
      example:
        id: "1c9e4d2b-7a3f-4e58-9b21-0d6f5a4c3e77"
        name: "Sanidade"
        parentId: "4f2a6b8c-1d3e-4a5b-8c7d-9e0f1a2b3c44"
      properties:
        id:
          type: string
          format: uuid
          example: "1c9e4d2b-7a3f-4e58-9b21-0d6f5a4c3e77"
        name:
          type: string
          maxLength: 255
          pattern: "^\\S(.*\\S)?$"
          example: "Sanidade"
        parentId:
          type: [string, "null"]
          format: uuid
          example: "4f2a6b8c-1d3e-4a5b-8c7d-9e0f1a2b3c44"
          description: >-
            The term this one sits under. Null marks a root; the taxonomía is many-rooted and of
            any depth.

    CreateTermoRequest:
      type: object
      description: >-
        The name for a new term and the term it sits under. A null `parentId` places the term at
        the root, and so does omitting it.
      required: [name]
      example:
        name: "Sanidade"
        parentId: null
      properties:
        name:
          type: string
          maxLength: 255
          pattern: "^(?![\\s\\S]*[\\u0000\\n\\r\\u000B\\u000C\\u0085\\u2028\\u2029])\\s*\\S[\\s\\S]*$"
          example: "Sanidade e Benestar"
          description: >-
            A term's name is a single-line label. Horizontal whitespace *within* it is ordinary
            — most terms are several words — and leading or trailing whitespace is accepted here
            and does not survive, so the stored `Termo.name` never carries any. Whitespace is
            read broadly, taking in the non-breaking spaces a narrower reading would leave at an
            edge. Rejected outright, rather than stripped, are a line terminator anywhere in the
            name, which a label has no use for and which the stored form does not admit, and a
            NUL, which the datastore cannot hold in any text column. An all-whitespace name is
            rejected too, and the pattern is written so it means that whether a validator
            anchors it or not. Must not collide case-insensitively with a sibling's name. Note
            that `\s` is read slightly differently by ECMA-262 than by the server, which follows
            the Unicode whitespace set: a validator on the ECMA dialect accepts the separator
            controls U+001C–U+001F, which the server refuses, and refuses U+FEFF, which it
            accepts.
        parentId:
          type: [string, "null"]
          format: uuid
          example: "4f2a6b8c-1d3e-4a5b-8c7d-9e0f1a2b3c44"
          description: The term to create this one under. Null creates it at the root.

    RenameTermoRequest:
      type: object
      description: A term's new name.
      required: [name]
      example:
        name: "Sanidade e Benestar"
      properties:
        name:
          type: string
          maxLength: 255
          pattern: "^(?![\\s\\S]*[\\u0000\\n\\r\\u000B\\u000C\\u0085\\u2028\\u2029])\\s*\\S[\\s\\S]*$"
          example: "Sanidade e Benestar"
          description: >-
            The replacement name: non-blank once stripped of surrounding whitespace, stored
            stripped, and free among the names of the term's existing siblings, compared
            case-insensitively. As on the create it is a single-line label — horizontal
            whitespace within it is ordinary, whitespace is read broadly enough to take in the
            non-breaking spaces, and rejected rather than stripped are a line terminator
            anywhere in the name and a NUL the datastore cannot hold.

    MoveTermoRequest:
      type: object
      description: >-
        The term to move a term under. `parentId` is required because a null is a *value* here
        rather than an omission: it is how a term is moved out to the root, so a body leaving the
        field out states nothing and a caller must always send it. A null is equally never a
        rejection — the field is nullable and carries no non-null constraint, or moving a term to
        the root would be unexpressible.
      required: [parentId]
      example:
        parentId: null
      properties:
        parentId:
          type: [string, "null"]
          format: uuid
          example: "4f2a6b8c-1d3e-4a5b-8c7d-9e0f1a2b3c44"
          description: >-
            The term to move under. Null moves it to the root. May be neither the term itself nor
            one of its descendants.

    AssignTermoRequest:
      type: object
      description: >-
        The term to file an Órgano under. A placement is singular, so this replaces any current
        one. To leave an Órgano in no term, delete the placement rather than assigning a null
        here.
      required: [termoId]
      example:
        termoId: "1c9e4d2b-7a3f-4e58-9b21-0d6f5a4c3e77"
      properties:
        termoId:
          type: string
          format: uuid
          example: "1c9e4d2b-7a3f-4e58-9b21-0d6f5a4c3e77"
          description: An existing term of the taxonomía, from `GET /api/organos/taxonomia`.

    ImportOutcome:
      type: object
      description: >-
        The result of an import run that did not fail — a source failure is reported as a 500
        instead, never as this body. `added`, `refreshed` and `deactivated` are always 0 unless
        `status` is `SUCCESS`.
      required: [status, added, refreshed, deactivated]
      example:
        status: "SUCCESS"
        added: 3
        refreshed: 12
        deactivated: 1
      properties:
        status:
          type: string
          enum: [SUCCESS, ALREADY_RUNNING]
          example: "SUCCESS"
          description: >-
            SUCCESS if the import completed; ALREADY_RUNNING if another import was already in
            progress.
        added:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          example: 3
          description: Órganos new to the source, stored as active.
        refreshed:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          example: 12
          description: Órganos already stored, matched by identity and updated in place.
        deactivated:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          example: 1
          description: Previously-stored Órganos absent from this import, marked inactive.

    ImportRunStarted:
      type: object
      description: >-
        The identity of the run a trigger claimed. It is all a trigger can answer with — the
        import it started has not done anything yet — and it is the id `GET
        /api/admin/import-run/{id}` accepts verbatim.
      required: [runId]
      example:
        runId: "0196f3d2-0c4a-7b1e-9f3a-8d2c5e7a1b40"
      properties:
        runId:
          type: string
          format: uuid
          example: "0196f3d2-0c4a-7b1e-9f3a-8d2c5e7a1b40"
          description: The run's identity.

    MarkOutcome:
      type: object
      description: >-
        What marking an Órgano did: the mark, which is always written, plus the fate of the
        import it asked for. Exactly one of `runId` and `refusal` is non-null — a run started, or
        it did not and this says why. The mark stands in both cases, which is why a refusal here
        is not a `409`.
      required: [runId, refusal]
      example:
        runId: "0196f3d2-0c4a-7b1e-9f3a-8d2c5e7a1b40"
        refusal: null
      properties:
        runId:
          type: [string, "null"]
          format: uuid
          example: "0196f3d2-0c4a-7b1e-9f3a-8d2c5e7a1b40"
          description: >-
            The run importing this Órgano alone — never a sweep of every marked one. Null when no
            import started.
        refusal:
          type: [string, "null"]
          enum: [IMPORT_ALREADY_RUNNING, ORGANO_NOT_ELIGIBLE, null]
          example: null
          description: >-
            Why no import started, or null when one did. `IMPORT_ALREADY_RUNNING` is a matter of
            timing and resolves itself; `ORGANO_NOT_ELIGIBLE` means the Órgano is inactive in the
            catalogue and repeats until that changes. They are the same two refusals the triggers
            report as problem types.

    ImportRunOrgano:
      type: object
      description: >-
        One Órgano a run covers, and how it fared. `STOPPED` and `SKIPPED` are not failures — an
        Órgano is stopped when its mark was withdrawn, keeping everything already stored, and
        skipped when its history is already complete and there is no incremental mode to run yet.
      required: [organoId, state, added, refreshed, failureReason]
      example:
        organoId: "aaaaaaaa-aaaa-7aaa-8aaa-aaaaaaaaaaaa"
        state: "SUCCEEDED"
        added: 1204
        refreshed: 96
        failureReason: null
      properties:
        organoId:
          type: string
          format: uuid
          example: "aaaaaaaa-aaaa-7aaa-8aaa-aaaaaaaaaaaa"
          description: The covered Órgano's identity.
        state:
          type: string
          enum: [PENDING, IN_PROGRESS, SUCCEEDED, FAILED, STOPPED, SKIPPED]
          example: "SUCCEEDED"
          description: >-
            How this Órgano fared. `PENDING` is where every covered Órgano starts: the list is
            enumerated when the run is claimed rather than as the run reaches them.
        added:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 1204
          description: Contratos menores new to the store, read for this Órgano by this run.
        refreshed:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 96
          description: Contratos menores already stored, re-read by this run and updated in place.
        failureReason:
          type: [string, "null"]
          pattern: "^.{1,500}$"
          description: >-
            What the state cannot say: why a `FAILED` Órgano failed, why a `SKIPPED` one was
            passed over, and which withdrawal stopped a `STOPPED` one. Null otherwise. A
            summary on a single line, never the internals of the failure behind it: a reason
            longer than the bound is truncated, and one that says nothing is null.

    ImportRun:
      type: object
      description: >-
        One import run as a reader sees it. The counts are unbounded by anything but their type:
        a single Órgano's initial import runs to hundreds of thousands of contracts, so this is
        deliberately not `ImportOutcome`, whose verdicts and count range suit the catalogue
        import alone.
      required: [id, importer, state, startedAt, finishedAt, added, refreshed, coveredOrganos]
      example:
        id: "0196f3d2-0c4a-7b1e-9f3a-8d2c5e7a1b40"
        importer: "CONTRATOS_MENORES"
        state: "PARTIALLY_SUCCEEDED"
        startedAt: "2026-08-13T09:14:02Z"
        finishedAt: "2026-08-15T21:40:55Z"
        added: 1204
        refreshed: 96
        coveredOrganos:
          - organoId: "aaaaaaaa-aaaa-7aaa-8aaa-aaaaaaaaaaaa"
            state: "SUCCEEDED"
            added: 1204
            refreshed: 96
            failureReason: null
          - organoId: "bbbbbbbb-bbbb-7bbb-8bbb-bbbbbbbbbbbb"
            state: "FAILED"
            added: 0
            refreshed: 0
            failureReason: "The source became unreachable"
      properties:
        id:
          type: string
          format: uuid
          example: "0196f3d2-0c4a-7b1e-9f3a-8d2c5e7a1b40"
          description: The run's identity, as the trigger that claimed it returned it.
        importer:
          type: string
          enum: [ORGANOS, CONTRATOS_MENORES]
          example: "CONTRATOS_MENORES"
          description: >-
            Which import produced this run. Recorded so an outcome can say what ran; the guard
            does not tell them apart, since one live run of either refuses a trigger of either.
        state:
          type: string
          enum: [IN_PROGRESS, SUCCEEDED, PARTIALLY_SUCCEEDED, FAILED, ABANDONED]
          example: "PARTIALLY_SUCCEEDED"
          description: >-
            What the run amounts to. `PARTIALLY_SUCCEEDED` is the ordinary outcome of a run that
            carried on past an Órgano that failed, and the covered Órganos name which.
            `ABANDONED` is **derived, never stored**: a run whose process died stops advancing,
            and past a configured bound it reads as abandoned rather than as still in progress —
            which is precisely the run an administrator goes looking at.
        startedAt:
          type: string
          format: date-time
          example: "2026-08-13T09:14:02Z"
          description: When the run was claimed.
        finishedAt:
          type: [string, "null"]
          format: date-time
          example: "2026-08-15T21:40:55Z"
          description: >-
            When the run settled, or null when it has not. Null for an `ABANDONED` run too:
            nothing ever wrote its ending, which is what abandonment means.
        added:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 1204
          description: Contratos menores new to the store across every Órgano this run covered.
        refreshed:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 96
          description: Contratos menores this run re-read and updated in place, across every Órgano.
        coveredOrganos:
          type: array
          maxItems: 10000
          description: >-
            Every Órgano the run set out to cover, each with its own state and counts. Empty for
            the catalogue import, which covers no Órganos.
          items:
            $ref: "#/components/schemas/ImportRunOrgano"

    ContratosMenoresSummary:
      type: object
      description: >-
        What an Órgano's contratos menores section says about itself, answered before any contract
        is fetched. **Its presence is what says the section exists**: it is carried as the
        `contratos-menores` entry of an Órgano's families map, and an Órgano with no visible
        contrato menor carries no entry at all — which is also how one holding only contracts the
        system withholds is indistinguishable from one holding none. There is deliberately no *has
        contracts* flag, because a section exists exactly when there is a year to open it on and a
        flag beside the years could disagree with them.
      required: [years, partial, updating]
      example:
        years: [2025, 2024, 2023]
        partial: false
        updating: true
      properties:
        years:
          type: array
          minItems: 1
          maxItems: 100
          example: [2025, 2024, 2023]
          description: >-
            The publication years this Órgano has visible contratos menores in, newest first —
            the order a chooser offers them in, and the first of them is the year the section
            opens on. Only years: there is no *all years* member and no *undated* one, and the
            list is never empty, a section with no year being no section at all.
          items:
            type: integer
            format: int32
            minimum: 1000
            maximum: 9999
        partial:
          type: boolean
          example: false
          description: >-
            Whether what is shown is incomplete, because this Órgano's initial import has not
            reached its earliest publication yet. Independent of `updating`, and never collapsed
            into a combined status: an Órgano unmarked halfway through its initial import is
            partial *and* no longer being refreshed, which one status field would have to lie
            about.
        updating:
          type: boolean
          example: true
          description: >-
            Whether this Órgano's contratos menores are still being refreshed, so what is shown
            is expected to change. It says nothing about which Órganos an administrator has
            marked — that the two coincide today is an implementation fact, not a promise this
            field makes.

    RuntimeMetrics:
      type: object
      description: >-
        One detailed runtime sample. The exact field set is illustrative and never includes
        secrets or connection values.
      required: [timestamp]
      example:
        timestamp: "2026-07-18T09:30:00Z"
        jvm:
          heapUsedBytes: 536870912
          heapMaxBytes: 2147483648
          nonHeapUsedBytes: 100663296
          threadCount: 42
          uptimeMillis: 3600000
          gcCollectionCount: 17
          gcCollectionTimeMillis: 250
        system:
          cpuLoad: 0.35
        http:
          requestCount: 15230
          errorCount: 12
        datastorePool:
          active: 3
          idle: 7
          max: 10
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-07-18T09:30:00Z"
        jvm:
          type: object
          example:
            heapUsedBytes: 536870912
            heapMaxBytes: 2147483648
            nonHeapUsedBytes: 100663296
            threadCount: 42
            uptimeMillis: 3600000
            gcCollectionCount: 17
            gcCollectionTimeMillis: 250
          properties:
            heapUsedBytes:
              type: integer
              format: int64
              minimum: 0
              maximum: 549755813888
              example: 536870912
            heapMaxBytes:
              type: integer
              format: int64
              minimum: 0
              maximum: 549755813888
              example: 2147483648
            nonHeapUsedBytes:
              type: integer
              format: int64
              minimum: 0
              maximum: 549755813888
              example: 100663296
            threadCount:
              type: integer
              format: int32
              minimum: 0
              maximum: 100000
              example: 42
            uptimeMillis:
              type: integer
              format: int64
              minimum: 0
              maximum: 315360000000
              example: 3600000
            gcCollectionCount:
              type: integer
              format: int64
              minimum: 0
              maximum: 9223372036854775807
              example: 17
              description: Collections performed by the garbage collectors since startup.
            gcCollectionTimeMillis:
              type: integer
              format: int64
              minimum: 0
              maximum: 315360000000
              example: 250
              description: Accumulated garbage-collection time since startup, in milliseconds.
        system:
          type: object
          example:
            cpuLoad: 0.35
          properties:
            cpuLoad:
              type: [number, "null"]
              format: double
              minimum: 0
              maximum: 1
              example: 0.35
              description: >-
                Recent system/CPU load, 0.0-1.0, or null on platforms where the running instance
                does not report it.
        http:
          type: object
          example:
            requestCount: 15230
            errorCount: 12
          properties:
            requestCount:
              type: integer
              format: int64
              minimum: 0
              maximum: 9223372036854775807
              example: 15230
            errorCount:
              type: integer
              format: int64
              minimum: 0
              maximum: 9223372036854775807
              example: 12
        datastorePool:
          type: object
          example:
            active: 3
            idle: 7
            max: 10
          properties:
            active:
              type: integer
              format: int32
              minimum: 0
              maximum: 10000
              example: 3
            idle:
              type: integer
              format: int32
              minimum: 0
              maximum: 10000
              example: 7
            max:
              type: integer
              format: int32
              minimum: 0
              maximum: 10000
              example: 10

    Error:
      type: object
      description: >-
        An RFC 9457 Problem Details error envelope (`application/problem+json`) returned for
        non-2xx responses.
      required: [type, title, status]
      example:
        type: "urn:conxugal:problem-type:duplicate-email"
        title: "Conflict"
        status: 409
        detail: "An account with email new.admin@conxugal.gal already exists."
      properties:
        type:
          type: string
          format: uri
          example: "urn:conxugal:problem-type:duplicate-email"
          description: A URI identifying the problem type.
        title:
          type: string
          pattern: "^.{1,100}$"
          example: "Conflict"
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          example: 409
          description: The HTTP status code, repeated from the response status.
        detail:
          type: [string, "null"]
          pattern: "^.{1,500}$"
          example: "An account with email new.admin@conxugal.gal already exists."
          description: >-
            A human-readable, non-sensitive description of this occurrence. Null when the problem
            type carries no further detail beyond its title.
        instance:
          type: [string, "null"]
          pattern: "^.{1,500}$"
          example: "/api/admin/users"
          description: >-
            The request path that produced this problem. Populated for generic/fallback failures
            (e.g. an unexpected server error); absent (or null) for the specific business-outcome
            problems (e.g. duplicate email, last-admin refusal) that don't set it.
