name: UI CI

on:
  pull_request:
    branches: [trunk]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"
  push:
    branches: [trunk]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"

# Matches ui-acceptance.yml and server-ci.yml: a superseded pull request push is cancelled
# rather than run to completion, while pushes to trunk are left uncancellable.
concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run is about two minutes. The cap is the counterpart of the concurrency group
    # above: pushes to trunk are not cancellable, so without it a stuck run holds the group for
    # GitHub's 6h default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/package.json
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
