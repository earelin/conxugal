name: UI CI

on:
  pull_request:
    branches: [trunk]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"
      - ".tool-versions"
  push:
    branches: [trunk]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"
      - ".tool-versions"

# Matches ui-acceptance.yml and server-ci.yml: a superseded pull request push is cancelled
# rather than run to completion, while pushes to trunk are left uncancellable.
concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run is about two minutes. The cap is the counterpart of the concurrency group
    # above: pushes to trunk are not cancellable, so without it a stuck run holds the group for
    # GitHub's 6h default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      # `cache: npm` is gone from setup-node above: its post action saves on any event and
      # v7.0.0 exposes no read-only toggle, so a lockfile bump on a pull request left an 85 MB
      # copy in refs/pull/N/merge that no other run could read.
      #
      # This job is the only writer of npm-ui-v1-*, and that is forced rather than preferred.
      # The key is the hash of ui/package-lock.json, so it moves only when that file moves,
      # and that file is under this workflow's `ui/**` push filter — so a trunk push that can
      # move the key always runs this job. Server CI cannot take the role: `ui/**` is not in
      # its push filter at all, even though ./gradlew build runs npm ci through the npmCi task,
      # so a merged lockfile bump would never trigger it and the key would go unseeded.
      # Narrowing this workflow's paths: would strand the four restore-only sites.
      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-ui-v1-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: npm-ui-v1-${{ runner.os }}-

      - run: npm ci

      - name: Save the npm cache
        if: ${{ github.event_name == 'push' && steps.npm-cache.outputs.cache-hit != 'true' && !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - run: npm run lint
      - run: npm run test
      - run: npm run build
