name: UI CI

# Lints, tests and builds ui/ (ADR-0004: Vite, React Router, Mantine) on
# changes to it.
on:
  push:
    branches: [trunk]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
