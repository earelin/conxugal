name: UI CI

on:
  pull_request:
    branches: [trunk]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"
  push:
    branches: [trunk]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/package.json
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
