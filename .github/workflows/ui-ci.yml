name: UI CI

on:
  pull_request:
    branches: [trunk]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"
      - ".tool-versions"
  push:
    branches: [trunk]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"
      - ".tool-versions"

# Matches ui-acceptance.yml and server-ci.yml: a superseded pull request push is cancelled
# rather than run to completion, while pushes to trunk are left uncancellable.
concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run is about two minutes. The cap is the counterpart of the concurrency group
    # above: pushes to trunk are not cancellable, so without it a stuck run holds the group for
    # GitHub's 6h default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      # setup-node above is made to cache nothing, by both of the routes it has. `cache: npm`
      # is gone because its post action saves on any event and v7.0.0 exposes no read-only
      # toggle, so a lockfile bump on a pull request left an 85 MB copy in refs/pull/N/merge
      # that no other run could read. `package-manager-cache` is set because it defaults to
      # true and turns npm caching back on by itself when a root package.json declares
      # `packageManager` or `devEngines` — there is none today, and left unset the rule below
      # would rest on that absence rather than on anything stated. The four restore-only sites
      # repeat the input and point back here.
      #
      # This job is the only writer of npm-ui-v1-*, and that is forced rather than preferred.
      # The key is the hash of ui/package-lock.json, so it moves only when that file moves,
      # and that file is under this workflow's `ui/**` push filter — so a trunk push that can
      # move the key always runs this job. Server CI cannot take the role: `ui/**` is not in
      # its push filter at all, even though ./gradlew build runs npm ci through the npmCi task,
      # so a merged lockfile bump would never trigger it and the key would go unseeded.
      # Narrowing this workflow's paths: would strand the four restore-only sites.
      #
      # The writer alone gets no restore-keys, and that asymmetry is the point. Nothing prunes
      # ~/.npm — `npm ci` does not, only `npm cache verify` GCs — so restoring the previous
      # entry by prefix and saving on top of it would ratchet the entry upward on every
      # lockfile bump, for ever. An exact-key miss here means one cold download in the one job
      # that can afford it, which is what setup-node's npm path did (it passes no restore keys
      # either). The four readers keep the prefix, so a bump stays cheap for them.
      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-ui-v1-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - run: npm ci

      # No status function on the `if:`, so `success()` is implied: a failed `npm ci` must not
      # upload a half-populated ~/.npm, because the entry is immutable and the primary-key hit
      # it then scores would suppress every later save.
      - name: Save the npm cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/trunk' && steps.npm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - run: npm run lint
      - run: npm run test
      - run: npm run build
