name: Server CI

# Builds and tests server/ (ADR-0001: Micronaut, Java 25) on changes to it.
on:
  push:
    branches: [trunk]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # Handles dependency/build caching and Gradle Wrapper checksum validation.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build
