name: Server CI

on:
  pull_request:
    branches: [trunk]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  push:
    branches: [trunk]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # Handles dependency/build caching and Gradle Wrapper checksum validation.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build
