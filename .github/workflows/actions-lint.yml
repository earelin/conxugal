name: Actions Lint

# Mirrors the local pre-commit hook (.claude/settings.json): only runs when
# staged/pushed changes touch .github/workflows/.
on:
  pull_request:
    branches: [trunk]
    paths:
      - ".github/workflows/**"
  push:
    branches: [trunk]
    paths:
      - ".github/workflows/**"

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships preinstalled on the ubuntu-latest runner image;
      # actionlint auto-detects it on PATH to lint embedded `run:` steps.
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run actions-lint.sh
        run: scripts/actions-lint.sh
