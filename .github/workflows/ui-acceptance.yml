name: UI Acceptance Tests

# Deliberately narrower than ui-ci.yml's blanket "ui/**": this job boots a
# container and a browser, so a doc-only edit under ui/ should not start it.
on:
  pull_request:
    branches: [trunk]
    paths:
      # acceptance suite and its stubbed API
      - "ui/e2e/**"
      - "ui/wiremock/**"
      - "ui/playwright.config.ts"
      - "ui/docker-compose.yml"
      # application sources
      - "ui/src/**"
      - "ui/public/**"
      - "ui/index.html"
      - "ui/vite.config.ts"
      - "ui/tsconfig*.json"
      - "ui/postcss.config.cjs"
      # dependencies
      - "ui/package.json"
      - "ui/package-lock.json"
      - ".github/workflows/ui-acceptance.yml"
  push:
    branches: [trunk]
    paths:
      # acceptance suite and its stubbed API
      - "ui/e2e/**"
      - "ui/wiremock/**"
      - "ui/playwright.config.ts"
      - "ui/docker-compose.yml"
      # application sources
      - "ui/src/**"
      - "ui/public/**"
      - "ui/index.html"
      - "ui/vite.config.ts"
      - "ui/tsconfig*.json"
      - "ui/postcss.config.cjs"
      # dependencies
      - "ui/package.json"
      - "ui/package-lock.json"
      - ".github/workflows/ui-acceptance.yml"

concurrency:
  group: ui-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/package.json
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      # Keyed on the resolved Playwright version rather than package-lock.json:
      # the version pins the browser build, so an unrelated dependency bump does
      # not discard the cache.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # playwright.config.ts declares only the chromium project. Left
      # unconditional so a partially populated cache self-heals; on a hit this
      # only verifies. No --with-deps: ubuntu-latest already carries every
      # browser library, and the sole packages it adds are CJK/Cyrillic fonts
      # this Galician, text-assertion-only suite never renders — fonts whose
      # mirror once stalled this step for ten minutes.
      - name: Install Playwright browser
        run: npx playwright install chromium

      # The stub the built SPA is proxied to (preview.proxy in vite.config.ts).
      # `api:up` already waits for the container's healthcheck; --quiet-pull
      # keeps the per-layer download bars out of the log, where they are noise
      # rather than feedback.
      - name: Start the stubbed API
        run: npm run api:up -- --quiet-pull

      # Built here rather than from playwright's webServer command, which a
      # reused server would skip — leaving the run to assert against a stale
      # bundle. GitHub Actions exports CI=true, which playwright.config.ts reads
      # for retries, forbidOnly and the reporters.
      - run: npm run build

      - name: Run acceptance tests
        run: npx playwright test

      # working-directory does not apply to a `uses:` step, so this path is
      # relative to the repository root.
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

      - name: Dump the stub server logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stubbed API
        if: always()
        run: npm run api:down
