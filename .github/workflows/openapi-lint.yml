name: OpenAPI Lint

on:
  pull_request:
    branches: [trunk]
    paths:
      - "docs/api/openapi.yaml"
      - ".vacuum.yaml"
      - "scripts/openapi-lint.sh"
      - ".github/workflows/openapi-lint.yml"
  push:
    branches: [trunk]
    paths:
      - "docs/api/openapi.yaml"
      - ".vacuum.yaml"
      - "scripts/openapi-lint.sh"
      - ".github/workflows/openapi-lint.yml"

jobs:
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install vacuum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -fsSL https://quobix.com/scripts/install_vacuum.sh | sh

      - name: Run openapi-lint.sh
        run: scripts/openapi-lint.sh
