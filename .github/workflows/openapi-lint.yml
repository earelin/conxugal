name: OpenAPI Lint

on:
  pull_request:
    branches: [trunk]
    paths:
      - "docs/api/openapi.yaml"
      - ".vacuum.yaml"
      - "scripts/openapi-lint.sh"
      - ".github/workflows/openapi-lint.yml"
      - ".tool-versions"
  push:
    branches: [trunk]
    paths:
      - "docs/api/openapi.yaml"
      - ".vacuum.yaml"
      - "scripts/openapi-lint.sh"
      - ".github/workflows/openapi-lint.yml"
      - ".tool-versions"

permissions:
  contents: read

jobs:
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Restored always, written only from trunk — see the note in actions-lint.yml.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.8.16"
          install_args: vacuum
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/trunk' }}

      - name: Run openapi-lint.sh
        run: scripts/openapi-lint.sh
