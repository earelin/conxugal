name: Docs Lint

on:
  pull_request:
    branches: [trunk]
    paths:
      - "docs/**"
      - "*.md"
      - ".markdownlint.jsonc"
      - "scripts/docs-lint.sh"
      - ".github/workflows/docs-lint.yml"
      - ".tool-versions"
  push:
    branches: [trunk]
    paths:
      - "docs/**"
      - "*.md"
      - ".markdownlint.jsonc"
      - "scripts/docs-lint.sh"
      - ".github/workflows/docs-lint.yml"
      - ".tool-versions"

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # node is installed because markdownlint-cli2 and maid come from the npm backend.
      # install_args keeps the JDK out of this job.
      # Restored always, written only from trunk — see the note in actions-lint.yml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.8.16"
          install_args: node lychee npm:markdownlint-cli2 npm:@probelabs/maid
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/trunk' }}

      - name: Run docs-lint.sh
        run: scripts/docs-lint.sh
