name: Docs Lint

on:
  pull_request:
    branches: [trunk]
    paths:
      - "docs/**"
      - "*.md"
      - ".markdownlint.jsonc"
      - "scripts/docs-lint.sh"
      - ".github/workflows/docs-lint.yml"
  push:
    branches: [trunk]
    paths:
      - "docs/**"
      - "*.md"
      - ".markdownlint.jsonc"
      - "scripts/docs-lint.sh"
      - ".github/workflows/docs-lint.yml"

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Deliberately unlocked: these are throwaway linters on a runner that holds
      # no secrets, and pinning them would be a bump obligation Dependabot cannot see.
      - name: Install markdownlint-cli2 and maid
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g markdownlint-cli2 @probelabs/maid

      - name: Install lychee
        run: |
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP"/lychee-x86_64-unknown-linux-gnu/lychee "$RUNNER_TEMP"/lychee
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run docs-lint.sh
        run: scripts/docs-lint.sh
